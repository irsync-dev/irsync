# cargo-nextest settings. CI runs the tests with `cargo nextest run --profile ci`
# (see .github/workflows/ci.yml); `cargo test` keeps working as before.

[profile.ci]
# Run every test, so one failure does not hide the others.
fail-fast = false
# Kill a test that runs longer than 5 minutes and name it, instead of letting
# a hang run into GitHub's 6-hour job limit. The slowest tests take about
# 3 minutes on the macOS runners.
slow-timeout = { period = "60s", terminate-after = 5 }
# Print a failing test's output when it fails and again at the end.
failure-output = "immediate-final"

[profile.ci-macos]
inherits = "ci"
# The macOS runners are slow and have 3 cores, and the tests keep them busy
# throughout, so only running less shortens the job. These tests take about
# 14 of the 32 minutes of test time there, and test code that works the same
# on every OS; Linux CI runs them. A local run on a Mac runs them too, unless
# it asks for this profile.
default-filter = """
not (binary(backpressure) | binary(blocking_pool) | binary_id(netstress::e2e))
"""
