# irsync on the desk

config_version = 2

# the nas
[servers.nas] # same line as nas
# above endpoint_id of nas
endpoint_id = "069ffbb125300737c2767fed918cd5f4bc12b3102fdd9009a2a1320e2ebd3191" # trailing endpoint_id of nas
# above address
address = [
    # above the first address
    "nas.lan:4433", # trailing first address
    "10.0.0.2:4433", # trailing second address
] # trailing address
# above ssh
ssh = "me@nas" # trailing ssh
# tail of nas

# the desk
[servers.desk] # same line as desk
# above endpoint_id of desk
endpoint_id = "92d89d1be7daf279e1e1446df1442e5a49c6e7c5d77be07c1f0b89e5d2aadd18" # trailing endpoint_id of desk
# tail of desk

# was the endpoint_id of [hosts.nas]; kept as a client so the grants naming nas still apply
[clients.nas]
client_id = "069ffbb125300737c2767fed918cd5f4bc12b3102fdd9009a2a1320e2ebd3191"

[clients.desk]
# above client_id of desk
client_id = "a35d848a3af131007b97b09bb866adce34f244db7816b4eb3f7a332ccf544b7c" # trailing client_id of desk

# the phone
[clients.phone] # same line as phone
# above client_id of phone
client_id = "6e7a1cdd29b0b78fd13af4c5598feff4ef2a97166e3ca6f2e4fbfccd80505bf1" # trailing client_id of phone
# above relay of phone
# trailing relay of phone
# above address of phone
# trailing the address of phone
# tail of phone

# the photos
[exports.photos] # same line as photos
# above path
path = "/photos" # trailing path
rw = [
    # above nas in rw
    "nas", # trailing nas in rw
    "phone", # trailing phone in rw
]
# tail of photos

# every export
[all] # same line as all
# above ro of all
ro = ["desk"] # trailing ro of all

# immediate
[immediate] # same line as immediate
# above rw of immediate
rw = ["phone"] # trailing rw of immediate
# tail of immediate

# the footer
