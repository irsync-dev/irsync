[package]
name = "irsync"
version.workspace = true
edition.workspace = true

[features]
test-hooks = []

[dependencies]
irsync-proto = { path = "../irsync-proto" }
nix = { workspace = true, features = ["fs", "user", "time"] }
iroh = { workspace = true }
ssh-key = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand_core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rand_core = { workspace = true }
ssh-key = { workspace = true, features = ["rsa"] }
