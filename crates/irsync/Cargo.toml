[package]
name = "irsync"
version.workspace = true
edition.workspace = true

[features]
default = ["otel"]
test-hooks = []
# Network-fault test rig: a fault-injecting iroh custom transport. Never in a release build.
netsim = [
    "iroh/unstable-custom-transports",
    "dep:iroh-base",
    "dep:n0-watcher",
    "dep:noq-udp",
    "dep:rand",
    "dep:rand_chacha",
]
# OTLP export of spans and metrics.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tonic",
    "dep:rustls",
]

[dependencies]
irsync-proto = { path = "../irsync-proto" }
nix = { workspace = true, features = ["fs", "resource", "user", "time"] }
iroh = { workspace = true }
# Only for CustomAddr, which iroh does not re-export. Used by netsim.
iroh-base = { workspace = true, optional = true }
# Only for the custom transport trait's address watcher and receive metadata. Used by netsim.
n0-watcher = { workspace = true, optional = true }
noq-udp = { workspace = true, optional = true }
ssh-key = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-util = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
# Only for its native root certificates on gRPC over TLS.
tonic = { workspace = true, optional = true, features = ["tls-native-roots"] }
# Only to install a TLS crypto provider: iroh's reqwest ships none.
rustls = { workspace = true, optional = true, features = ["ring"] }
serde = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tempfile = { workspace = true }
clap = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
rusqlite = { workspace = true }
blake3 = { workspace = true }
jwalk = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
futures = { workspace = true }
rpassword = { workspace = true }
noq-proto = { workspace = true }
iroh-mainline-address-lookup = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["signal"] }
tempfile = { workspace = true }
rand_core = { workspace = true }
# No default features: `--no-default-features` must reach the test builds too.
irsync = { path = ".", default-features = false, features = ["test-hooks"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[build-dependencies]
vergen-gitcl = "10"
