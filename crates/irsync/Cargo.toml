[package]
name = "irsync"
version.workspace = true
edition.workspace = true

[features]
test-hooks = []

[dependencies]
irsync-proto = { path = "../irsync-proto" }
nix = { workspace = true, features = ["fs", "resource", "user", "time"] }
iroh = { workspace = true }
ssh-key = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tempfile = { workspace = true }
clap = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
rand_core = { workspace = true }
rusqlite = { workspace = true }
blake3 = { workspace = true }
jwalk = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
futures = { workspace = true }
rpassword = { workspace = true }
noq-proto = { workspace = true }
iroh-mainline-address-lookup = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rand_core = { workspace = true }
irsync = { path = ".", features = ["test-hooks"] }

[build-dependencies]
vergen-gitcl = "10"
