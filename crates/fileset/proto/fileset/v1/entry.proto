syntax = "proto3";
package fileset.v1;
message Xattr { bytes name = 1; bytes value = 2; }
message Entry {
  uint32 kind = 1; uint32 mode = 2; uint32 uid = 3; uint32 gid = 4;
  uint64 size = 5; uint64 nlink = 6; uint64 ino = 7; uint64 dev = 8; uint64 rdev = 9;
  int64 mtime_sec = 10; uint32 mtime_nsec = 11; int64 ctime_sec = 12; uint32 ctime_nsec = 13;
  optional bytes blake3 = 14; optional bytes target = 15;
  repeated Xattr xattrs = 16; uint32 flags = 17; uint64 generation = 18;
}
