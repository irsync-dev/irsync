# cargo-deny settings. CI runs `cargo deny --locked check` on every change
# (tools/ci.sh and ci.yml, job `deny`) and the advisories check daily (advisories.yml).
# How to accept an advisory: book/src/contributing/supply-chain.md.

[graph]
all-features = true
# The platforms irsync is built for: the release targets
# (dist-workspace.toml), FreeBSD, and Linux with glibc, which CI and
# developers build. A crate built only for another platform (Windows, say)
# is not ours to answer for and is left out of every check here. Add a
# platform here when irsync starts building for it. The licenses of every
# platform's crates are still checked, by deny-license-check.toml.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-freebsd",
]

[advisories]
version = 2
# Any RustSec advisory fails, and so do unmaintained and yanked crates. An
# advisory we accept goes here with its ID and the reason, for example
#   { id = "RUSTSEC-2026-0000", reason = "no fixed version yet; irsync never calls foo()" },
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# Keep this table the same as the one in deny-license-check.toml (a test in
# .github/scripts/tests checks it).
# Every license in the tree today, all compatible with irsync's MIT license.
# Crates that offer a GPL or LGPL alternative (self_cell, r-efi) are used
# under their MIT or Apache-2.0 option. MPL-2.0 (attohttpc, option-ext) is
# file-level copyleft: fine for a binary as long as those crates' sources
# stay available, which crates.io ensures.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
# crates.io, and upstream iroh (pinned to a commit in Cargo.toml). Nothing else.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/n0-computer/iroh"]

[bans]
# A second version of a crate fails the check. A crate may have more than one
# version only if it is listed under `skip` below, with the crate that pulls
# in the older version as the reason. When that crate catches up, the entry
# no longer matches and the check fails until it is removed (CI runs with
# `-D unmatched-skip`). How to handle a new duplicate:
# book/src/contributing/supply-chain.md.
multiple-versions = "deny"
# Single entries, not `skip-tree`: skip-tree would also hide any new
# duplicate further down the same tree, which is what this check is for.
skip = [
    # iroh's QUIC stack (noq-proto) is still on the older RustCrypto AES-GCM
    # stack; ssh-key is on the newer one.
    { crate = "aead@0.5", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "aes@0.8", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "aes-gcm@0.10", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "cipher@0.4", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "cpufeatures@0.2", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "crypto-common@0.1", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "ctr@0.9", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "ghash@0.5", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "inout@0.1", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "polyval@0.6", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    { crate = "universal-hash@0.5", reason = "noq-proto (iroh) uses aes-gcm 0.10" },
    # The OpenTelemetry SDK and the metrics crates are on rand 0.9; irsync,
    # filegen and iroh are on rand 0.10.
    { crate = "getrandom@0.3", reason = "rand_core 0.9, from opentelemetry_sdk and metrics-util" },
    { crate = "rand@0.9", reason = "opentelemetry_sdk and metrics-util use rand 0.9" },
    { crate = "rand_chacha@0.9", reason = "rand 0.9, from opentelemetry_sdk and metrics-util" },
    { crate = "rand_core@0.9", reason = "rand 0.9, from opentelemetry_sdk and metrics-util" },
    { crate = "rand_xoshiro@0.7", reason = "metrics-util uses rand_xoshiro 0.7" },
    # hashbrown: 0.17 is current; three older versions come from fjall,
    # prost-build and the metrics crates.
    { crate = "hashbrown@0.14", reason = "dashmap, from fjall" },
    { crate = "hashbrown@0.15", reason = "petgraph, from prost-build" },
    { crate = "hashbrown@0.16", reason = "metrics-util, and quick_cache from fjall's lsm-tree" },
    { crate = "foldhash@0.1", reason = "hashbrown 0.15, from petgraph and prost-build" },
    { crate = "spin@0.9", reason = "flume, from fjall" },
    { crate = "lru@0.18", reason = "n0-dns-resolver (iroh); iroh-relay is on 0.19" },
    { crate = "base64@0.22", reason = "tonic, tokio-websockets (iroh) and metrics-exporter-prometheus" },
    { crate = "unicode-width@0.1", reason = "miette, from prost-reflect and protox" },
    { crate = "syn@2", reason = "proc macros not yet on syn 3: derive_more (iroh), curve25519-dalek, enum_dispatch (fjall) and others" },
]
