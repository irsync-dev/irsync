<!doctype html>
<!-- The GitHub social preview, 1280x640: the header and headline of the
     landing page in its dark theme (site/tokens.json). The words are the
     landing page's. site/tools/github-images.sh draws it to
     social-preview.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: Barlow; font-weight: 600; src: url(../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2); }
      @font-face { font-family: Inter; font-weight: 400; src: url(../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); }
      html, body { margin: 0; }
      body {
        width: 1280px; height: 640px; box-sizing: border-box;
        padding: 96px 112px; background: #0e1920; color: #e2ebee;
        display: flex; flex-direction: column; justify-content: center;
      }
      .name { display: flex; align-items: center; gap: 24px; font: 600 64px/1 Barlow, sans-serif; }
      .name svg { width: 0.9em; height: 0.9em; }
      h1 { margin: 64px 0 0; max-width: 18ch; font: 600 80px/1.05 Barlow, sans-serif; letter-spacing: -0.01em; }
      p { margin: 32px 0 0; max-width: 30em; font: 400 32px/1.5 Inter, sans-serif; color: #96a9b3; }
    </style>
  </head>
  <body>
    <div class="name"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13.2 18.8 21 11" stroke="#2cc4d1" stroke-width="4" fill="none"/><circle cx="8.5" cy="23.5" r="5.5" fill="none" stroke="#2cc4d1" stroke-width="4"/><circle cx="23.5" cy="8.5" r="7.5" fill="#2cc4d1"/></svg>irsync</div>
    <h1>Resilient file sync over any network</h1>
    <p>Copy files and directory trees the way rsync does, directly between your devices.</p>
  </body>
</html>
