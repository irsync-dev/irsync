# The license check over every crate in Cargo.lock, for every platform:
# deny.toml looks only at the platforms irsync is built for. tools/ci.sh and
# ci.yml run it as the job `licenses-all`
# (`cargo deny --locked --config deny-license-check.toml check licenses`).
# A failure does not block a pull request, but it does block a release.
# Only the licenses are checked with this file; the rest is in deny.toml.

[graph]
all-features = true

[licenses]
version = 2
# Keep this table the same as the one in deny.toml (a test in
# .github/scripts/tests checks it).
# Every license in the tree today, all compatible with irsync's MIT license.
# Crates that offer a GPL or LGPL alternative (self_cell, r-efi) are used
# under their MIT or Apache-2.0 option. MPL-2.0 (attohttpc, option-ext) is
# file-level copyleft: fine for a binary as long as those crates' sources
# stay available, which crates.io ensures.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
