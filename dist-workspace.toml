[workspace]
# Only the generic package in packaging/dist is released. It builds the
# `irsync` and `fileset` crates itself (see packaging/dist/build.sh); the
# Cargo crates are not dist members.
members = ["dist:packaging/dist"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "irsync-dev/homebrew-tap"
# Customize the Homebrew formula name
formula = "irsync"
# Publish jobs to run in CI: none. The release gate pushes the Homebrew
# formula itself (.github/workflows/publish-homebrew.yml), in the `release`
# environment that holds HOMEBREW_TAP_TOKEN, so release.yml needs no secrets.
# dist still builds the formula (installers = homebrew) and attaches it to the
# release. (A local custom publish job is broken in dist 0.34.0: it writes
# `uses: $/.github/...`.)
publish-jobs = []
# Whether to publish prereleases to package managers
publish-prereleases = false
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Signed build provenance for every artifact, checkable with
# `gh attestation verify <file> --repo irsync-dev/irsync`
github-attestations = true
# Attest in the host job, just before publishing, so every file on the release
# gets one: by default dist attests only the per-target archives, and the
# installer, the Homebrew formula and the checksum files go without.
github-attestations-phase = "host"
# Whether to install an updater program
install-updater = false
# Don't run the release workflow on pull requests; PR CI stays as it was
pr-run-mode = "skip"
# release.yml only starts via workflow_dispatch. .github/workflows/release-gate.yml
# launches it after the full test suite passed on the tagged commit. Never
# launch release.yml by hand.
dispatch-releases = true
# Extra files for every archive. packaging/dist/build.sh writes this directory;
# it lands in the tarball as irsync-<target>/man/.
include = ["packaging/dist/man"]

[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-unknown-linux-musl = "ubuntu-latest"
aarch64-apple-darwin = "macos-latest"

# The musl C toolchain, for the C code in the dependencies (bundled SQLite, ring).
[dist.dependencies.apt]
musl-tools = "*"
# For tools/build-man.sh, which builds the man pages.
pandoc = "*"

# For tools/build-man.sh. dist installs these on the build runners only; they
# are not dependencies of the Homebrew formula.
[dist.dependencies.homebrew]
pandoc = "*"

# Pin the Actions in the generated release.yml to commits; a version tag can
# be moved by the Action's owner. Dependabot does not update this table: bump
# it with the pins in the other workflows (same versions).
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
