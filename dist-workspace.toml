[workspace]
# Only the generic package in packaging/dist is released. It builds the
# `irsync` and `fileset` crates itself (see packaging/dist/build.sh); the
# Cargo crates are not dist members.
members = ["dist:packaging/dist"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "irsync-dev/homebrew-tap"
# Customize the Homebrew formula name
formula = "irsync"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to publish prereleases to package managers
publish-prereleases = false
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Whether to install an updater program
install-updater = false

[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-unknown-linux-musl = "ubuntu-latest"
aarch64-apple-darwin = "macos-latest"

# The musl C toolchain, for the C code in the dependencies (bundled SQLite, ring).
[dist.dependencies.apt]
musl-tools = "*"
