// Part of the normative irsync wire protocol. Any change to these messages
// bumps PROTOCOL_VERSION (irsync-proto).
syntax = "proto3";
package irsync.v1;

import "irsync/v1/common.proto";

// The admin service: a client with `admin = "rw"` or `"ro"` changes or reads
// the daemon's configuration over a control stream opened with a Hello
// whose request is `admin`, once the daemon has answered with AdminReady.

message AdminRequest {
  oneof msg {
    Change change = 1;
    Commit commit = 2;
    Read read = 3;
    // Start hashing an export's folder into its index, outside the
    // transaction; answered at once with IndexStarted.
    StartIndex start_index = 4;
  }
}

message StartIndex {
  string export = 1; // by name, as in the saved config
}

// Apply every change sent since the stream opened (or the last commit),
// all or nothing.
message Commit {}

message Change {
  oneof op {
    ExportAdd export_add = 1;
    ExportRemove export_remove = 2;
    GrantAdd grant_add = 3;
    GrantRemove grant_remove = 4;
    ClientAdd client_add = 5;
    ClientRemove client_remove = 6;
    ClientRename client_rename = 7;
    ClientSet client_set = 8;
    ExportSet export_set = 9;
    ExportRename export_rename = 10;
  }
}

message ExportAdd {
  string target = 1; // "[NAME:]PATH", PATH absolute or ~
  bool read_only = 2;
  bool index_at_start = 3;
}

message ExportRemove {
  string name = 1;
}

message ExportSet {
  string name = 1;
  repeated string settings = 2; // "KEY=VALUE" as typed
}

message ExportRename {
  string old = 1;
  string new = 2;
}

message GrantAdd {
  string export = 1;
  string who = 2; // a client name, an EndpointId or a public key line
  bool ro = 3;
}

message GrantRemove {
  string export = 1;
  string who = 2; // "all" as in the CLI
}

message ClientAdd {
  string name = 1;
  bytes id = 2;
}

message ClientRemove {
  string name = 1;
  bool force = 2;
}

message ClientRename {
  string old = 1;
  string new = 2;
}

message ClientSet {
  string name = 1;
  repeated string settings = 2; // "KEY=VALUE" as typed
}

message Read {
  oneof what {
    // exports, clients and daemon facts: for export list, grant list,
    // client list and show
    ReadView view = 1;
    // config get KEY, or config list (empty key)
    ReadConfig config = 2;
    // the indexing runs since the daemon started
    ReadIndexing indexing = 3;
  }
}

message ReadIndexing {}

message ReadView {}

message ReadConfig {
  string key = 1;
}

message AdminReply {
  oneof msg {
    Ack ack = 1;
    Nack nack = 2;
    View view = 3;
    ConfigText config = 4;
    Error refused = 5;
    IndexStarted index_started = 6;
    Indexing indexing = 7;
  }
}

message IndexStarted {
  bool already_running = 1; // run is the one that was going already
  IndexRun run = 2;
}

message Indexing {
  repeated IndexRun runs = 1; // the latest run per path, in path order
}

message Ack {
  repeated string results = 1; // one line per change, what the local command prints
}

message Nack {
  uint32 change = 1; // 1-based; 0: the whole transaction
  string reason = 2;
}

message View {
  bytes daemon_id = 1;
  bool allow_all_paths = 2;
  repeated ExportView exports = 3;
  repeated ClientView clients = 4;
}

message ExportView {
  string name = 1;
  string path = 2;
  bool read_only = 3;
  bool index_at_start = 4;
  bool fsync = 5;
  bool is_auto = 6;
  repeated string rw = 7;
  repeated string ro = 8;
}

message ClientView {
  string name = 1;
  bytes id = 2;
  map<string, string> rights = 3; // key -> "rw" | "ro", only set rights
}

// One indexing run of an export's folder: in progress (ended_at 0) or
// the latest that ended. Counts only, never a file inside the export.
message IndexRun {
  string export = 1;     // the export's name when the run started
  string path = 2;       // the folder
  string started_by = 3; // the client, as the audit log names it; empty at start
  bool at_start = 4;     // started by index_at_start
  uint64 started_at = 5; // Unix seconds
  uint64 ended_at = 6;   // Unix seconds; 0 while running
  uint64 examined = 7;
  uint64 hashed = 8;
  uint64 bytes = 9;
  uint64 failed = 10;
  bool incomplete = 11;  // the walk could not list everything
  string error = 12;     // why the run failed as a whole
}

message ConfigText {
  repeated string lines = 1;
}
