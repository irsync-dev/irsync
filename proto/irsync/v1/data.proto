// Part of the normative irsync wire protocol. Field numbers are never reused.
syntax = "proto3";
package irsync.v1;

// One unidirectional stream per range, sender -> receiver.
message DataStreamHeader {
  bytes session_id = 1;
  uint64 file_id = 2;
  uint64 offset = 3;
  uint64 length = 4;
  uint32 first_chunk_idx = 5;
}
// One chunk per frame: its bytes in `data` (<= 1 MiB), or, for a chunk the
// receiver offered a `ChunkBasis` for, the operations that rebuild it in
// `ops` (then `data` is empty). The rebuilt bytes must hash to the chunk's
// record like any other; the receiver verifies them before writing.
message DataChunk {
  bytes data = 1;
  repeated DeltaOp ops = 2;
}
// `len` bytes at `offset` of the receiver's old file (inside the region the
// receiver signed), or literal bytes.
message CopyOld {
  uint64 offset = 1;
  uint32 len = 2;
}
message DeltaOp {
  oneof op {
    bytes literal = 1;
    CopyOld copy = 2;
  }
}
// RangeSet/Range (persisted partial progress) live in common.proto.
