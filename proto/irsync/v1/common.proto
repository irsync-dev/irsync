syntax = "proto3";
package irsync.v1;

message Hash {
  bytes bytes = 1;
} // 32-byte BLAKE3

message Hello {
  uint32 protocol_version = 1; // `PROTOCOL_VERSION` (irsync-proto)
  bytes session_id = 2; // 16 bytes; empty = new session
  reserved 3; // was the export name; the daemon resolves `path` now
  // PATH as typed: an export name followed by a path inside it, a path
  // relative to the daemon's home, or an absolute path; a trailing slash
  // is stripped and sets contents_only.
  bytes path = 4;
  enum Direction {
    CLIENT_SENDS = 0;
    DAEMON_SENDS = 1;
    // No session: the daemon answers with an ExportList of what this key
    // may reach, then closes. `path` and `name` are empty.
    LIST_EXPORTS = 2;
    PROBE = 3; // no session: the daemon answers with PathInfo for path, then closes
  }
  Direction direction = 5;
  uint32 chunk_min = 6;
  uint32 chunk_avg = 7;
  uint32 chunk_max = 8; // must equal protocol constants
  bool contents_only = 9; // rsync trailing-slash rule applied to the remote path
  // Receiver-side options, honoured by the daemon only when it receives
  // (CLIENT_SENDS, which already requires write access to a writable export).
  enum DeleteMode {
    DELETE_OFF = 0;
    DELETE_BEFORE = 1;
    DELETE_DURING = 2;
    DELETE_AFTER = 3;
  }
  DeleteMode delete_mode = 10;
  bool delete_excluded = 11;
  optional uint64 max_delete = 12; // absent = unlimited; 0 = delete nothing
  bool dry_run = 13; // the receiver changes nothing
  bool ignore_errors = 14; // delete even if a listing was incomplete
  bool itemize = 15; // the receiver sends Itemized codes (-i)
  bool update_only = 16; // -u: keep destination files newer than the source
  bool checksum = 17; // -c: equal size+mtime is not enough, compare content
  // --inplace: a changed file is written into the destination file itself
  // (ascending, forward-only reuse) instead of a `.part` renamed over it.
  bool inplace = 18;
  // --append / --append-verify: a destination file shorter than the
  // source is extended by its tail; one that is not shorter is skipped.
  enum AppendMode {
    APPEND_OFF = 0;
    APPEND = 1; // the existing prefix is trusted (rsync --append)
    APPEND_VERIFY = 2; // the prefix is verified too: a plain DELTA, with the skip rule
  }
  AppendMode append = 19;
  BuildInfo build = 20; // the client's build, logged by the daemon
  // On CLIENT_SENDS when the source had no trailing slash: its basename,
  // which the daemon joins to the resolved path (rsync's rule). Else empty.
  bytes name = 21;
  // The client's -l -p -t -g -o -D -H -S: what a receiving daemon applies
  // and what a sending daemon lists as hard links. Absent (an older client):
  // the daemon preserves everything it can.
  message Preserve {
    bool links = 1;
    bool perms = 2;
    bool times = 3;
    bool group = 4;
    bool owner = 5;
    bool devices = 6;
    bool specials = 7;
    bool hard_links = 8;
    bool sparse = 9;
    bool recursive = 10; // off: top-level entries only, directories skipped
    bool dirs = 11; // with recursion off: directories themselves, without contents
  }
  Preserve preserve = 22;
  // The client's include/exclude rules, compiled (files from --exclude-from
  // and --include-from already read), in command-line order. A sending
  // daemon walks with them; a receiving daemon protects what they exclude
  // from deletion. Absent: no rules.
  message FilterRule {
    bool include = 1;
    bytes pattern = 2; // rsync pattern as typed (a pattern file may hold non-UTF-8 names)
  }
  repeated FilterRule filters = 23;
  // --partial-dir, relative to the destination root (a canonical relative
  // path: no `..`); honoured by a receiving daemon, which keeps the `.part`
  // files of interrupted transfers under it. Empty: beside their files.
  bytes partial_dir = 24;
  // --numeric-ids: a receiving daemon applies the ids as sent instead of
  // mapping the owner and group names to its own ids.
  bool numeric_ids = 25;
  // The client's W3C trace context (`traceparent`, `tracestate`) so the
  // daemon's session joins the client's trace; empty means no trace.
  string traceparent = 26;
  string tracestate = 27;
  // --no-rename-detection: a receiving daemon fills no file from chunks
  // other files on its side hold; everything not in a file's own old
  // version comes from the sender.
  bool no_local_reuse = 28;
  // --fsync: a receiving daemon flushes each file to disk before renaming
  // it into place. Off (rsync's default): nothing is flushed explicitly.
  bool fsync = 29;
  // --paranoid: both roles take part in the final re-check (Settle,
  // Replan, Settled), which the receiver asks for with Settle. Only the
  // sending side sends each file from a reflink clone or hashes it again
  // before the receiver places it; a receiving daemon (a push) does neither.
  bool paranoid = 30;
  bool single_file = 31; // name (21) is the source basename on a push and the receiver's file name on a pull
}
// One export the asking key may use.
message ExportEntry {
  string name = 1;
  bytes path = 2; // the export's directory on the daemon's machine
  enum Access {
    RO = 0;
    RW = 1;
  }
  Access access = 3; // effective: read_only caps RW to RO
}
// The reply to a LIST_EXPORTS Hello, sorted by name.
message ExportList {
  repeated ExportEntry exports = 1;
}
// The reply to a PROBE Hello: what `path` is on the daemon. A refusal is
// an Error instead; `kind` is always set and on a field number Error does
// not use, so the client tells the two apart.
message PathInfo {
  enum Kind {
    MISSING = 0;
    DIRECTORY = 1;
    FILE = 2; // anything that isn't a directory
  }
  reserved 1, 2;
  optional Kind kind = 3;
}
message HelloAck {
  bytes session_id = 1;
  bool resumed = 2;
  uint32 protocol_version = 3;
  BuildInfo build = 4; // the daemon's build, logged by the client
  bytes single_name = 5; // push: the daemon's name for the file (the wire name)
}
// What a peer was built from; absent from an older peer.
message BuildInfo {
  string version = 1; // package version
  string commit = 2; // short git commit, or "unknown"
  optional bool dirty = 3; // uncommitted changes at build time; absent = unknown
}
message Error {
  enum Code {
    UNKNOWN = 0;
    UNAUTHORIZED = 1;
    reserved 2; // was NO_SUCH_EXPORT: a path the key may not use is UNAUTHORIZED
    READ_ONLY = 3;
    BAD_PATH = 4;
    VERSION_MISMATCH = 5;
    BAD_SESSION = 6;
    INTERNAL = 7;
  }
  Code code = 1;
  string message = 2;
}
message ChunkRecord {
  uint64 offset = 1;
  uint32 len = 2;
  Hash hash = 3;
}

message FileEntry {
  bytes path = 1; // relative to root, '/'-separated, raw bytes
  // HARDLINK: a regular file sharing the inode of the earlier listed regular
  // file at `link_target` (sent only with -H; same size/mtime/mode).
  enum Kind {
    REGULAR = 0;
    DIRECTORY = 1;
    SYMLINK = 2;
    CHAR_DEV = 3;
    BLOCK_DEV = 4;
    FIFO = 5;
    SOCKET = 6;
    HARDLINK = 7;
  }
  Kind kind = 2;
  uint64 size = 3;
  int64 mtime_sec = 4;
  uint32 mtime_nsec = 5;
  uint32 mode = 6;
  uint32 uid = 7;
  uint32 gid = 8;
  bytes link_target = 9;
  uint64 rdev = 10;
  uint64 dev = 11;
  uint64 inode = 12;
  uint32 nlink = 13;
  optional Hash whole_hash = 14; // lazy: absent until computed
  bool sparse = 15;
  reserved 16 to 31; // later metadata (xattrs)
  // The owner's and group's names on the sending side, empty when the id has
  // none there. A receiver maps them to its own ids when the names exist
  // locally, else keeps the numbers (rsync's rule; --numeric-ids skips this).
  string user = 32;
  string group = 33;
}

// A source file's stat, as the sender compares it (`-H`'s link check).
message SourceStat {
  uint64 size = 1;
  int64 mtime_sec = 2;
  uint32 mtime_nsec = 3;
  int64 ctime_sec = 4;
  uint32 ctime_nsec = 5;
  uint64 inode = 6;
  uint32 mode = 7;
  uint32 uid = 8;
  uint32 gid = 9;
}
message Range {
  uint64 offset = 1;
  uint64 length = 2;
}
message RangeSet {
  repeated Range ranges = 1;
}
