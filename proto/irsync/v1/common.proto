syntax = "proto3";
package irsync.v1;

message Hash { bytes bytes = 1; }                 // 32-byte BLAKE3

message Hello {
  uint32 protocol_version = 1;                    // 1
  bytes  session_id = 2;                          // 16 bytes; empty = new session
  string module = 3;
  bytes  path = 4;                                // relative to module root
  enum Direction { CLIENT_SENDS = 0; DAEMON_SENDS = 1; }
  Direction direction = 5;
  uint32 chunk_min = 6; uint32 chunk_avg = 7; uint32 chunk_max = 8;  // must equal protocol constants
  bool contents_only = 9;                         // rsync trailing-slash rule applied to the remote path
}
message HelloAck { bytes session_id = 1; bool resumed = 2; uint32 protocol_version = 3; }
message Error { enum Code { UNKNOWN = 0; UNAUTHORIZED = 1; NO_SUCH_MODULE = 2; READ_ONLY = 3; BAD_PATH = 4; VERSION_MISMATCH = 5; BAD_SESSION = 6; INTERNAL = 7; } Code code = 1; string message = 2; }
message ChunkRecord { uint64 offset = 1; uint32 len = 2; Hash hash = 3; }

message FileEntry {
  bytes path = 1;                                 // relative to root, '/'-separated, raw bytes
  enum Kind { REGULAR = 0; DIRECTORY = 1; SYMLINK = 2; CHAR_DEV = 3; BLOCK_DEV = 4; FIFO = 5; SOCKET = 6; }
  Kind kind = 2;
  uint64 size = 3;
  int64 mtime_sec = 4;
  uint32 mtime_nsec = 5;
  uint32 mode = 6;
  uint32 uid = 7;
  uint32 gid = 8;
  bytes link_target = 9;
  uint64 rdev = 10;
  uint64 dev = 11;
  uint64 inode = 12;
  uint32 nlink = 13;
  optional Hash whole_hash = 14;                  // lazy: absent until computed
  bool sparse = 15;
  reserved 16 to 31;                              // later metadata (xattrs)
}
