syntax = "proto3";
package irsync.v1;

message Hash {
  bytes bytes = 1;
} // 32-byte BLAKE3

// The first frame of a connection, on its control stream, client ->
// daemon. The daemon answers with one HelloReply. `protocol_version` and
// HelloReply's `error` keep their field numbers in every protocol version,
// so a client of another version still reads why it was refused.
message Hello {
  uint32 protocol_version = 1; // `PROTOCOL_VERSION` (irsync-proto)
  BuildInfo build = 2; // the client's build, logged by the daemon
  // The client's W3C trace context (`traceparent`, `tracestate`) so the
  // daemon's session joins the client's trace; empty means no trace.
  string traceparent = 3;
  string tracestate = 4;
  // What the client asks for. A Hello without one is refused.
  oneof request {
    SyncRequest push = 5; // a session in which the client sends
    SyncRequest pull = 6; // a session in which the daemon sends
    ListExports list_exports = 7;
    Probe probe = 8;
    OpenAdmin admin = 9;
  }
}
// A push or a pull: the session's place and options.
message SyncRequest {
  bytes session_id = 1; // 16 bytes to resume a session; empty = new session
  // PATH as typed: an export name followed by a path inside it, a path
  // relative to the daemon's home, or an absolute path; a trailing slash
  // is stripped and sets contents_only.
  bytes path = 2;
  bool contents_only = 3; // rsync trailing-slash rule applied to the remote path
  // On a push of a source without a trailing slash: its basename, which
  // the daemon joins to the resolved path (rsync's rule). With
  // `single_file`: the source's basename on a push, and the name the file
  // gets on the client on a pull. Else empty.
  bytes name = 4;
  bool single_file = 5; // the session copies one file, named by `name`
  uint32 chunk_min = 6;
  uint32 chunk_avg = 7;
  uint32 chunk_max = 8; // must equal protocol constants
  // The client's -l -p -t -g -o -D -H -S: what a receiving daemon applies
  // and what a sending daemon lists as hard links. Required: the daemon
  // refuses a push or a pull without it.
  message Preserve {
    bool links = 1;
    bool perms = 2;
    bool times = 3;
    bool group = 4;
    bool owner = 5;
    bool devices = 6;
    bool specials = 7;
    bool hard_links = 8;
    bool sparse = 9;
    bool recursive = 10; // off: top-level entries only, directories skipped
    bool dirs = 11; // with recursion off: directories themselves, without contents
  }
  Preserve preserve = 9;
  // The client's include/exclude rules, compiled (files from --exclude-from
  // and --include-from already read), in command-line order. A sending
  // daemon walks with them; a receiving daemon protects what they exclude
  // from deletion. Absent: no rules.
  message FilterRule {
    bool include = 1;
    bytes pattern = 2; // rsync pattern as typed (a pattern file may hold non-UTF-8 names)
  }
  repeated FilterRule filters = 10;
  // Receiver-side options, honoured by the daemon only when it receives
  // (a push, which already requires write access to a writable export).
  enum DeleteMode {
    DELETE_OFF = 0;
    DELETE_BEFORE = 1;
    DELETE_DURING = 2;
    DELETE_AFTER = 3;
  }
  DeleteMode delete_mode = 11;
  bool delete_excluded = 12;
  optional uint64 max_delete = 13; // absent = unlimited; 0 = delete nothing
  bool dry_run = 14; // the receiver changes nothing
  bool ignore_errors = 15; // delete even if a listing was incomplete
  bool itemize = 16; // the receiver sends Itemized codes (-i)
  bool update_only = 17; // -u: keep destination files newer than the source
  bool checksum = 18; // -c: equal size+mtime is not enough, compare content
  // --inplace: a changed file is written into the destination file itself
  // (ascending, forward-only reuse) instead of a `.part` renamed over it.
  bool inplace = 19;
  // --append / --append-verify: a destination file shorter than the
  // source is extended by its tail; one that is not shorter is skipped.
  enum AppendMode {
    APPEND_OFF = 0;
    APPEND = 1; // the existing prefix is trusted (rsync --append)
    APPEND_VERIFY = 2; // the prefix is verified too: a plain DELTA, with the skip rule
  }
  AppendMode append = 20;
  // --partial-dir, relative to the destination root (a canonical relative
  // path: no `..`); honoured by a receiving daemon, which keeps the `.part`
  // files of interrupted transfers under it. Empty: beside their files.
  bytes partial_dir = 21;
  // --numeric-ids: a receiving daemon applies the ids as sent instead of
  // mapping the owner and group names to its own ids.
  bool numeric_ids = 22;
  // --no-rename-detection: a receiving daemon fills no file from chunks
  // other files on its side hold; everything not in a file's own old
  // version comes from the sender.
  bool no_local_reuse = 23;
  // --fsync: a receiving daemon flushes each file to disk before renaming
  // it into place. Off (rsync's default): nothing is flushed explicitly.
  bool fsync = 24;
  // --paranoid: both roles take part in the final re-check (Settle,
  // Replan, Settled), which the receiver asks for with Settle. Only the
  // sending side sends each file from a reflink clone or hashes it again
  // before the receiver places it; a receiving daemon (a push) does neither.
  bool paranoid = 25;
  // --bwlimit in bytes per second, honoured by a sending daemon (a pull),
  // which paces the file data it sends. On a push the client paces its
  // own sending and the daemon ignores this. Absent or 0: no limit.
  optional uint64 bwlimit = 26;
}
// No session: the daemon answers with the ExportList of what this key may
// reach, then closes.
message ListExports {}
// No session: the daemon resolves `path` and checks it as for a pull, and
// answers with PathInfo, then closes.
message Probe {
  bytes path = 1;
}
// The control stream becomes an admin session (AdminRequest in,
// AdminReply out) once the daemon answers with AdminReady.
message OpenAdmin {}

// The daemon's answer to Hello: exactly one of these.
message HelloReply {
  oneof reply {
    Error error = 1; // a refusal; the daemon closes the connection (code 2)
    HelloAck ack = 2; // a push or a pull: the session is open
    ExportList exports = 3; // list_exports
    PathInfo path_info = 4; // probe
    AdminReady admin_ready = 5; // admin
  }
}
// One export the asking key may use.
message ExportEntry {
  string name = 1;
  bytes path = 2; // the export's directory on the daemon's machine
  enum Access {
    RO = 0;
    RW = 1;
  }
  Access access = 3; // effective: read_only caps RW to RO
}
// The reply to list_exports, sorted by name.
message ExportList {
  repeated ExportEntry exports = 1;
}
// The reply to a probe: what `path` is on the daemon.
message PathInfo {
  enum Kind {
    MISSING = 0;
    DIRECTORY = 1;
    FILE = 2; // anything that isn't a directory
  }
  Kind kind = 1;
}
message HelloAck {
  bytes session_id = 1;
  bool resumed = 2;
  uint32 protocol_version = 3;
  BuildInfo build = 4; // the daemon's build, logged by the client
  bytes single_name = 5; // push: the daemon's name for the file (the wire name)
}
// The admin session is open: AdminRequest frames may follow.
message AdminReady {}
// What a peer was built from.
message BuildInfo {
  string version = 1; // package version
  string commit = 2; // short git commit, or "unknown"
  optional bool dirty = 3; // uncommitted changes at build time; absent = unknown
}
// A refusal of a Hello (in HelloReply), of an admin request (in
// AdminReply), or a fatal session error (in Control), either way.
message Error {
  enum Code {
    UNSPECIFIED = 0; // never sent
    UNAUTHORIZED = 1;
    READ_ONLY = 2;
    BAD_PATH = 3;
    VERSION_MISMATCH = 4;
    BAD_SESSION = 5;
    INTERNAL = 6;
    BAD_REQUEST = 7; // a malformed or unsupported request
  }
  Code code = 1;
  string message = 2;
}
message ChunkRecord {
  uint64 offset = 1;
  uint32 len = 2;
  Hash hash = 3;
}

message FileEntry {
  bytes path = 1; // relative to root, '/'-separated, raw bytes
  // HARDLINK: a regular file sharing the inode of the earlier listed regular
  // file at `link_target` (sent only with -H; same size/mtime/mode).
  enum Kind {
    REGULAR = 0;
    DIRECTORY = 1;
    SYMLINK = 2;
    CHAR_DEV = 3;
    BLOCK_DEV = 4;
    FIFO = 5;
    SOCKET = 6;
    HARDLINK = 7;
  }
  Kind kind = 2;
  uint64 size = 3;
  int64 mtime_sec = 4;
  uint32 mtime_nsec = 5;
  uint32 mode = 6;
  uint32 uid = 7;
  uint32 gid = 8;
  bytes link_target = 9;
  uint64 rdev = 10;
  uint64 dev = 11;
  uint64 inode = 12;
  uint32 nlink = 13;
  optional Hash whole_hash = 14; // lazy: absent until computed
  bool sparse = 15;
  reserved 16 to 31; // later metadata (xattrs)
  // The owner's and group's names on the sending side, empty when the id has
  // none there. A receiver maps them to its own ids when the names exist
  // locally, else keeps the numbers (rsync's rule; --numeric-ids skips this).
  string user = 32;
  string group = 33;
}

// A source file's stat, as the sender compares it (`-H`'s link check).
message SourceStat {
  uint64 size = 1;
  int64 mtime_sec = 2;
  uint32 mtime_nsec = 3;
  int64 ctime_sec = 4;
  uint32 ctime_nsec = 5;
  uint64 inode = 6;
  uint32 mode = 7;
  uint32 uid = 8;
  uint32 gid = 9;
}
message Range {
  uint64 offset = 1;
  uint64 length = 2;
}
message RangeSet {
  repeated Range ranges = 1;
}
