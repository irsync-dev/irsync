// Part of the normative irsync wire protocol. Field numbers are never reused.
syntax = "proto3";
package irsync.v1;

import "irsync/v1/common.proto";

// A session uses two bidirectional streams, both opened by the client right
// after HelloAck. The control stream (the one that carried Hello) carries
// Control frames. The listing stream carries each side's listing, both
// directions: ListingFrame frames, entries and errors in path order, then
// one `end`, then the end of that half. A side that does not list (a
// receiver resuming a complete plan) ends its half without a frame.

// The first frame of the client's half of the listing stream, before any
// ListingFrame: the session (from HelloAck) the stream belongs to.
message ListingStreamHeader {
  bytes session_id = 1;
}
// One frame of a side's listing.
message ListingFrame {
  oneof frame {
    FileEntry entry = 1; // in path order, ascending
    // A gap in the listing, sent in path order where the missing entries
    // would have been: a directory that could not be read (right after its
    // own entry) or an entry that could not be stat'ed. The listing goes
    // on; `end` then says incomplete.
    PathError error = 2;
    ListingEnd end = 3; // the last frame
  }
}
// `count`: the entries sent before it.
message ListingEnd {
  bool incomplete = 1;
  uint64 count = 2;
}
message PlanItem { // receiver -> sender
  uint64 file_id = 1;
  bytes path = 2;
  enum Action {
    WHOLE = 0;
    DELTA = 1;
    // The receiver holds the first `append_from` bytes and trusts them: the
    // sender digests and sends only the tail from there (its chunk list
    // covers `[append_from, size)` and carries no whole-file hash).
    APPEND = 2;
  }
  Action action = 3;
  uint64 append_from = 4;
}
// sender -> receiver: the start of a file's chunk list. A list travels in
// pieces small enough for a control frame: a ChunkListStart, then
// ChunkListMore frames in order, until `total` records have come. A list
// of no chunks (an empty file) is one ChunkListStart without records.
// For an APPEND the list covers only the tail and `whole_hash` is absent:
// the receiver folds the whole-file hash from the bytes it places.
// Lists travel in room the receiver grants (see ListRoom): a list's start
// takes `total` records of it, and a sender sends a list only once it
// fits. A start that does not fit is a protocol error. A start for a file
// that already has a list replaces it (its room is freed).
message ChunkListStart {
  uint64 file_id = 1;
  Hash whole_hash = 2;
  uint32 total = 3;
  // The stat the file was hashed under: the receiver places the file with
  // its size, mtime, mode, owner and group, not the walk's, so content and
  // metadata come from the same moment. With `-H`, the receiver asks the
  // sender whether a file's other names still are this file (CheckLink).
  SourceStat stat = 4;
  // The names of `stat.uid` and `stat.gid` on the sender (empty when it
  // has none), mapped as a listing entry's are.
  string user = 5;
  string group = 6;
  repeated ChunkRecord chunks = 7; // the list's first records
}
// sender -> receiver: the next records of a file's chunk list. `first` is
// the index of `chunks[0]` in the whole list: the number of records sent
// so far.
message ChunkListMore {
  uint64 file_id = 1;
  uint32 first = 2;
  repeated ChunkRecord chunks = 3;
}
// sender -> receiver: drop the file's chunk list and free its room. A
// sender that lists a file again sends this first, so the old list is
// dropped without waiting for room for the new one.
message WithdrawChunkList {
  uint64 file_id = 1;
}
// receiver -> sender: `records` chunk records of room freed (lists the
// receiver dropped: placed, failed or replaced files). Each connection
// starts with the session's list budget of room and no grant; a grant that
// would raise the sender's room above that budget is a protocol error.
message ListRoom {
  uint64 records = 1;
}
// receiver -> sender: every chunk of the file is verified; may it be placed?
// The receiver renames the file into place (or settles it in place) only
// after a PlaceVerdict that says the source is unchanged.
// `gen`: the number of the chunk list the file was verified against, counted
// per file and connection from 1: every ChunkListStart. The sender answers
// a MayPlace for a list that is not its latest with `changed`, and never
// places it.
message MayPlace {
  uint64 file_id = 1;
  uint32 gen = 2;
}
// sender -> receiver: the answer to MayPlace. `changed`: the source differs
// from the stat its chunk list was hashed under; the receiver drops what it
// verified and waits for a new chunk list (or the sender's SourceError).
message PlaceVerdict {
  uint64 file_id = 1;
  bool changed = 2;
  uint32 gen = 3; // the MayPlace's
}
// `--paranoid` (the client's Hello), unless a dry run: the final re-check.
// receiver -> sender, once, in place of SessionDone when the receiver has
// planned every path and has no file in flight: the sender stats every
// listed regular file again (a resumed session that reuses the stored plan
// lists nothing: only the files sent on this connection).
message Settle {}
// sender -> receiver, after Settle: a listed regular file that differs from
// the stat it was listed (or last hashed) under: its entry as it is now,
// with its path. The receiver plans it again as it plans a listed file, under a new
// file id above every id the session used; a file already placed stays
// placed. One per path at most; only before Settled.
message Replan {
  FileEntry entry = 1;
}
// sender -> receiver, after its Replans: the re-check is over. `vanished`:
// listed files gone, or no longer regular files (capped as
// SessionDone.deleted_paths is; `vanished_omitted` counts the rest). `errors`:
// files the re-check could not stat. The receiver sends SessionDone once
// the re-planned files are done.
message Settled {
  repeated bytes vanished = 1;
  repeated PathError errors = 2;
  uint64 vanished_omitted = 3;
}
// `-H`, unless a dry run: the link check. receiver -> sender, once every
// path is planned, nothing is in flight and the final re-check (if any) is
// settled: one CheckLink per hard link to be made to a file sent in this
// session (on any connection), then CheckLinksEnd. `path` is the name to
// link, `want` the stat its target was hashed under (as sent with the
// target's chunk list). The link is made only if `path` is still exactly
// that file: same inode, size, times, mode and ids. The change time moves
// whenever a name is added or removed, so an equal stat means `path` has
// named that content since it was hashed.
message CheckLink {
  bytes path = 1;
  SourceStat want = 2;
}
message CheckLinksEnd {}
// sender -> receiver, after CheckLinksEnd: a CheckLink `path` that is no
// longer the file it names in `want`. The receiver does not link it. Then
// LinksChecked ends the check.
message Unlinked {
  oneof name {
    // Still a regular file the walk would list: the name as it is now (its
    // path in the entry). The receiver plans it as a file of its own, as
    // for a Replan, and the sender admits its PlanItem with its retry used.
    FileEntry entry = 1;
    // Gone, or not such a file: the name, which fails.
    bytes failed = 2;
  }
}
message LinksChecked {}
message NeedChunks {
  uint64 file_id = 1;
  repeated uint32 chunk_idx = 2;
  // Chunks of `chunk_idx` the receiver already holds the first bytes of,
  // from an earlier connection: chunk index -> bytes held, less than the
  // chunk. The sender starts that chunk's data there and sends it raw.
  map<uint32, uint32> held = 3;
} // receiver -> sender; empty = nothing needed (local copy / already have).
// A large request comes as several, each taking the bases sent before it.
// receiver -> sender, before the NeedChunks that asks for `chunk_idx`: block
// signatures over a region of the receiver's old file (`offset` is where it
// starts in that file; the region is `block` * blocks long, a shorter tail
// is unsigned). Per block one rsync-style rolling sum (`weak`) and the
// first 8 bytes of its BLAKE3 hash (`strong`, concatenated). The sender may
// answer the chunk with `DataChunk.ops` against this region; it must still
// hash to the chunk's record. Dropped by the sender after that one chunk.
message ChunkBasis {
  uint64 file_id = 1;
  uint32 chunk_idx = 2;
  uint64 offset = 3;
  uint32 block = 4; // 512 ..= 4096
  repeated fixed32 weak = 5;
  bytes strong = 6; // 8 * weak.len() bytes
}
// receiver -> sender: how a file ended on the receiver. DONE only after a
// PlaceVerdict saying unchanged.
message FileAck {
  uint64 file_id = 1;
  enum Status {
    UNSPECIFIED = 0; // never sent
    DONE = 1;
    HASH_MISMATCH = 2;
    WRITE_ERROR = 3;
  }
  Status status = 2;
  string message = 3;
  // DONE: bytes of the file the receiver did not take from the sender
  // (local copies, adopted progress, an identical file), for the sender's
  // matched count.
  uint64 matched = 4;
}
// sender -> receiver: the sender cannot read the file; the receiver drops
// it without a reply.
message SourceError {
  uint64 file_id = 1;
  string message = 2;
}
// A per-path problem the receiver recorded locally (mkdir, symlink, metadata, walk, ...).
message PathError {
  bytes path = 1;
  string message = 2;
}
// What the sender's listing held, by kind: the totals `--stats` and the
// "total size" trailer print. Hard links count as regular files.
message ListTotals {
  uint64 reg = 1;
  uint64 dir = 2;
  uint64 link = 3;
  uint64 special = 4;
  uint64 total_size = 5; // summed size of the regular files
}
// receiver -> sender: the session is over; its last frame on the control
// stream.
message SessionDone {
  // Files the receiver placed on this connection (one it found already
  // holding the content, settled in place, is not counted).
  uint64 files_placed = 1;
  uint64 bytes_received = 2; // file data received on this connection
  repeated PathError errors = 3;
  repeated bytes deleted_paths = 4; // paths the receiver deleted (capped)
  repeated bytes would_delete_paths = 5; // dry run: paths it would delete (capped)
  bool max_delete_reached = 6; // deletions stopped at --max-delete
  uint64 deleted_omitted = 7; // deleted paths beyond the cap
  uint64 would_delete_omitted = 8; // would-delete paths beyond the cap
  uint64 created = 9; // items the receiver created new (for --stats)
  uint64 placed_size = 10; // summed size of the files it placed
  // What the receiver counted in the sender's listing, over every
  // connection of the session. A sender that resumed from the receiver's
  // stored plan listed nothing itself and reports these.
  ListTotals listed = 11;
}
message Itemized {
  bytes path = 1;
  string code = 2;
} // receiver -> sender, rsync -i code (`>` = received)
// "I am busy": sent by either side while it makes local progress (hashing,
// writing, finalizing) that the peer cannot otherwise see, so the peer's
// inactivity watchdog stays quiet. Carries what the peer cannot otherwise see
// about this side's progress.
message Heartbeat {
  optional bytes walking = 1; // directory this side's listing walk is in (empty = the root); unset when not listing
  uint64 skipped_bytes = 2; // bytes of source files this side's planner found up to date (cumulative)
  uint64 deleted_count = 3; // paths this side's deletion pass removed so far
  uint64 delete_total = 4;  // its candidate count once known, else 0
  // A receiver that resumes its stored plan, once, before its first
  // request: what the sender's listing held on the first connection. Nothing
  // is listed again, and the sender's progress display needs the total.
  ListTotals listed = 5;
  // With `listed`: how many of its bytes need nothing more on this
  // connection (files found up to date, or placed by an earlier one).
  uint64 listed_settled = 6;
  // File data this side's receiver has taken in on this connection. The
  // sender counts it as progress: a big file sent over several connections,
  // none of which finishes it, still moves the session on.
  uint64 received_bytes = 7;
}
// Every frame on the control stream after the handshake.
message Control {
  oneof msg {
    PlanItem plan = 1;
    ChunkListStart chunk_list_start = 2;
    ChunkListMore chunk_list_more = 3;
    WithdrawChunkList withdraw_chunk_list = 4;
    ListRoom list_room = 5;
    ChunkBasis chunk_basis = 6;
    NeedChunks need = 7;
    MayPlace may_place = 8;
    PlaceVerdict place_verdict = 9;
    FileAck ack = 10;
    SourceError source_error = 11;
    Itemized itemized = 12;
    Heartbeat heartbeat = 13;
    Settle settle = 14;
    Replan replan = 15;
    Settled settled = 16;
    CheckLink check_link = 17;
    CheckLinksEnd check_links_end = 18;
    Unlinked unlinked = 19;
    LinksChecked links_checked = 20;
    SessionDone done = 21;
    Error error = 22; // a fatal error; the session ends
  }
}
