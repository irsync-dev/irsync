// Part of the normative irsync wire protocol. Field numbers are never reused.
syntax = "proto3";
package irsync.v1;

import "irsync/v1/common.proto";

// On the single bidirectional control stream, both directions.
message ListingEntry { FileEntry entry = 1; }                    // path order ascending
message ListingEnd { bool incomplete = 1; uint64 count = 2; }
message PlanItem {                                                // receiver -> sender
  uint64 file_id = 1;
  bytes path = 2;
  enum Action { WHOLE = 0; DELTA = 1; }
  Action action = 3;
}
message ChunkList { uint64 file_id = 1; uint64 size = 2; Hash whole_hash = 3; repeated ChunkRecord chunks = 4; } // sender -> receiver
message NeedChunks { uint64 file_id = 1; repeated uint32 chunk_idx = 2; }  // receiver -> sender; empty = nothing needed (local copy / already have)
message FileAck { uint64 file_id = 1; enum Status { DONE = 0; HASH_MISMATCH = 1; WRITE_ERROR = 2; } Status status = 2; string message = 3; }
message SessionDone { uint64 files = 1; uint64 bytes = 2; }
message Control {
  oneof msg {
    ListingEntry listing = 1;
    ListingEnd listing_end = 2;
    PlanItem plan = 3;
    ChunkList chunk_list = 4;
    NeedChunks need = 5;
    FileAck ack = 6;
    SessionDone done = 7;
    Error error = 8;
  }
}
