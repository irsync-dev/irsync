// Part of the normative irsync wire protocol. Field numbers are never reused.
syntax = "proto3";
package irsync.v1;

import "irsync/v1/common.proto";

// A session uses two bidirectional streams, both opened by the client right
// after HelloAck. The control stream (the one that carried Hello) carries
// every Control frame except the listing's. The listing stream carries each
// side's listing, both directions: ListingEntry and ListingError (`listing`,
// `listing_error`) frames in path order, then one ListingEnd, then the end
// of that half. A side that does not list (a receiver resuming a complete
// plan) ends its half without a frame.

// The first frame of the client's half of the listing stream, before any
// Control frame: the session (from HelloAck) the stream belongs to.
message ListingStreamHeader {
  bytes session_id = 1;
}
message ListingEntry {
  FileEntry entry = 1;
} // path order ascending
// `count`: the ListingEntry frames sent before it.
message ListingEnd {
  bool incomplete = 1;
  uint64 count = 2;
}
// A gap in the listing (`listing_error`, a PathError), sent in path order
// where the missing entries would have been: a directory that could not be
// read (right after its own entry) or an entry that could not be stat'ed.
// The listing goes on; ListingEnd then says incomplete.
message PlanItem { // receiver -> sender
  uint64 file_id = 1;
  bytes path = 2;
  enum Action {
    WHOLE = 0;
    DELTA = 1;
    // The receiver holds the first `append_from` bytes and trusts them: the
    // sender digests and sends only the tail from there (its chunk list
    // covers `[append_from, size)` and carries no whole-file hash).
    APPEND = 2;
  }
  Action action = 3;
  uint64 append_from = 4;
}
// sender -> receiver: the chunk list of a file, in pieces small enough for
// a control frame. The parts of a file arrive in order: `first` is the
// index of `chunks[0]` in the whole list, `total` the whole list's length,
// `last` marks the final part. `size` and `whole_hash` are repeated in
// every part. A list of no chunks (an empty file) is one empty last part.
// For an APPEND the list covers only the tail and `whole_hash` is absent:
// the receiver folds the whole-file hash from the bytes it places.
message ChunkListPart {
  uint64 file_id = 1;
  uint64 size = 2;
  Hash whole_hash = 3;
  uint32 total = 4;
  uint32 first = 5;
  repeated ChunkRecord chunks = 6;
  bool last = 7;
}
message NeedChunks {
  uint64 file_id = 1;
  repeated uint32 chunk_idx = 2;
} // receiver -> sender; empty = nothing needed (local copy / already have)
// receiver -> sender, before the NeedChunks that asks for `chunk_idx`: block
// signatures over a region of the receiver's old file (`offset` is where it
// starts in that file; the region is `block` * blocks long, a shorter tail
// is unsigned). Per block one rsync-style rolling sum (`weak`) and the
// first 8 bytes of its BLAKE3 hash (`strong`, concatenated). The sender may
// answer the chunk with `DataChunk.ops` against this region; it must still
// hash to the chunk's record. Dropped by the sender after that one chunk.
message ChunkBasis {
  uint64 file_id = 1;
  uint32 chunk_idx = 2;
  uint64 offset = 3;
  uint32 block = 4; // 512 ..= 4096
  repeated fixed32 weak = 5;
  bytes strong = 6; // 8 * weak.len() bytes
}
// receiver -> sender: DONE, HASH_MISMATCH, WRITE_ERROR. sender -> receiver: SOURCE_ERROR
// (the sender cannot read the file; the receiver drops it without a reply).
message FileAck {
  uint64 file_id = 1;
  enum Status {
    DONE = 0;
    HASH_MISMATCH = 1;
    WRITE_ERROR = 2;
    SOURCE_ERROR = 3;
  }
  Status status = 2;
  string message = 3;
  // DONE: bytes of the file the receiver did not take from the sender
  // (local copies, adopted progress, an identical file), for the sender's
  // matched count.
  uint64 matched = 4;
}
// A per-path problem the receiver recorded locally (mkdir, symlink, metadata, walk, ...).
message PathError {
  bytes path = 1;
  string message = 2;
}
message SessionDone {
  uint64 files = 1;
  uint64 bytes = 2;
  repeated PathError errors = 3;
  repeated bytes deleted = 4; // paths the receiver deleted (capped)
  repeated bytes would_delete = 5; // dry run: paths it would delete (capped)
  bool max_delete_reached = 6; // deletions stopped at --max-delete
  uint64 deleted_omitted = 7; // deleted paths beyond the cap
  uint64 would_delete_omitted = 8; // would-delete paths beyond the cap
  uint64 created = 9; // items the receiver created new (for --stats)
  uint64 transferred_size = 10; // summed size of the files it placed
}
message Itemized {
  bytes path = 1;
  string code = 2;
} // receiver -> sender, rsync -i code (`>` = received)
// "I am busy": sent by either side while it makes local progress (hashing,
// writing, finalizing) that the peer cannot otherwise see, so the peer's
// inactivity watchdog stays quiet. Carries what the peer cannot otherwise see
// about this side's progress.
message Heartbeat {
  optional bytes walking = 1; // directory this side's listing walk is in (empty = the root); unset when not listing
  uint64 skipped_bytes = 2; // bytes of source files this side's planner found up to date (cumulative)
  uint64 deleted = 3;       // paths this side's deletion pass removed so far
  uint64 delete_total = 4;  // its candidate count once known, else 0
}
message Control {
  reserved 4; // ChunkList, one frame per list (never shipped)
  oneof msg {
    ListingEntry listing = 1;
    ListingEnd listing_end = 2;
    PlanItem plan = 3;
    NeedChunks need = 5;
    FileAck ack = 6;
    SessionDone done = 7;
    Error error = 8;
    Itemized itemized = 9;
    Heartbeat heartbeat = 10;
    ChunkListPart chunk_list_part = 11;
    ChunkBasis chunk_basis = 12;
    PathError listing_error = 13;
  }
}
