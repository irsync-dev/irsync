// Local persistence only: session rows in each side's index. Never sent on the wire.
syntax = "proto3";
package irsync.v1;

import "irsync/v1/common.proto";
import "irsync/v1/control.proto";

// One file the session decided to transfer.
message PlanEntry {
  uint64 file_id = 1;
  bytes path = 2; // relative to the session root, raw bytes
  PlanItem.Action action = 3;
  FileEntry entry = 4; // receiver: the sender's listing entry (applied at finalize)
  uint64 append_from = 5; // APPEND: the trusted prefix length
}
message SessionPlan {
  repeated PlanEntry entries = 1;
  // Receiver: every path was planned (the sender's listing ended and the
  // planner finished), so a resumed session can skip the listing exchange.
  bool plan_complete = 2;
  // Receiver, once complete: directories whose metadata is applied at the end (path order).
  repeated FileEntry dirs = 3;
  // Receiver, once complete: problems recorded while walking and planning.
  repeated PathError errors = 4;
  uint64 skipped = 5; // receiver: regular files found up to date
  bool peer_listing_incomplete = 6; // receiver: the sender's listing was incomplete
  bytes remote_id = 7; // daemon: the client EndpointId that owns the session
  // Receiver, once complete: what the sender's listing held. A resumed
  // session lists nothing, and reports these.
  ListTotals listed = 8;
  // Receiver, once complete: items planned that the destination did not
  // have. A resumed session plans nothing, and reports this count.
  uint64 created = 9;
}
message SessionProgress {
  repeated uint64 done_file_ids = 1; // files acknowledged DONE
  uint64 bytes_transferred = 2; // cumulative over all connections
  uint64 deleted_count = 3; // deletions so far (counts against --max-delete)
  // Receiver, `-H`: files placed that had more than one name when listed,
  // with the stat their chunk list was hashed under, for the link check.
  repeated PlacedStat placed = 4;
}
message PlacedStat {
  bytes path = 1;
  SourceStat stat = 2;
}

// The `ranges` column of a partial record. `ranges`: the verified bytes of the
// `.part`. `held`: chunks not verified yet whose first bytes were written
// (offset: the chunk's, length: the bytes), so a later request can start
// after them; they are verified with the rest of the chunk.
message PartialRanges {
  repeated Range ranges = 1;
  repeated Range held = 2;
}
// A byte range of a file.
message Range {
  uint64 offset = 1;
  uint64 length = 2;
}
// The ranges of a `.part` the receiver has verified, as its partial record
// in the index holds them.
message RangeSet {
  repeated Range ranges = 1;
}
