[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
tokio = { version = "1", features = ["full"] }
iroh = "1.3"
iroh-base = "1.3"
n0-watcher = "1"
# Held below 1.4: noq-proto 1.4 closes the connection ("too many gaps in
# stream buffer") once a stream's receive buffer holds 1024 pieces separated
# by holes. Our 8 MiB stream window fits several thousand packets, so loss
# while the reader is slow ends the session; `blocking_pool.rs` hits it.
noq-udp = { version = "~1.3", default-features = false }
noq-proto = "~1.3"
iroh-mainline-address-lookup = "0.6"
iroh-mdns-address-lookup = "0.6"
fastcdc = "5"
blake3 = "1"
metrics = "0.24"
metrics-util = "0.20"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "grpc-tonic", "tls-ring", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false, features = ["metrics"] }
tonic = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false }
ssh-key = { version = "0.6", features = ["ed25519", "encryption", "std"] }
# Held at 0.40 (SQLite 3.53): SQLite 3.54 re-prepares a statement whose
# ORDER BY an index satisfies after every sqlite3_clear_bindings(), which
# rusqlite's statement cache calls on each return. Index lookups would be
# re-prepared on every call; `lookups_are_never_re_prepared` catches it.
rusqlite = { version = "0.40", features = ["bundled"] }
jwalk = "0.9"
nix = "0.31"
clap = { version = "4", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
url = { version = "2", features = ["serde"] }
dirs = "7"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
rpassword = "7"
fjall = "3.1"
xattr = "1.7"
crossbeam-channel = "0.5"
indicatif = "0.18"
console = "0.16"
jiff = "0.2"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rand_xoshiro = "0.6"
serde_yaml_ng = "0.10"
unicode-normalization = "0.1"
libc = "0.2"

# iroh 1.3.0 plus one fix: noq reads tokio's clock, so tests on tokio's
# paused clock can skip ahead (n0-computer/iroh#4676). Drop this once a
# release has it. The other crates come from the same commit so that each
# has one source.
[patch.crates-io]
iroh = { git = "https://github.com/irsync-dev/iroh", rev = "28466cc54f86df7a587249f8d54fb747988a3d3f" }
iroh-base = { git = "https://github.com/irsync-dev/iroh", rev = "28466cc54f86df7a587249f8d54fb747988a3d3f" }
iroh-dns = { git = "https://github.com/irsync-dev/iroh", rev = "28466cc54f86df7a587249f8d54fb747988a3d3f" }
iroh-relay = { git = "https://github.com/irsync-dev/iroh", rev = "28466cc54f86df7a587249f8d54fb747988a3d3f" }

[profile.release]
opt-level = "s"
strip = true
lto = "fat"
codegen-units = 1

# The profile that 'dist' will build with: the release settings above.
[profile.dist]
inherits = "release"

# No Cargo crate is released on its own. The one cargo dist package is the
# generic one in packaging/dist, which builds irsync and fileset together
# (see dist-workspace.toml).
[workspace.metadata.dist]
dist = false
