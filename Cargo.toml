[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.5"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
prost = "0.14"
prost-reflect = "0.16"
prost-build = "0.14"
protox = "0.10"
tokio = { version = "1", features = ["full"] }
iroh = "1.3"
iroh-base = "1.3"
n0-watcher = "1"
noq-udp = { version = "1.4", default-features = false }
# Held below 1.4: noq-proto 1.4.0 closes the connection ("too many gaps in
# stream buffer") once about 2000 full packets wait unread on one stream,
# with or without loss: it never merges them. That is under 3 MiB of our
# 8 MiB stream window, so any reader that falls behind ends the session;
# `backpressure.rs` and `blocking_pool.rs` hit it. Fixed upstream in
# n0-computer/noq#866, not yet released. .github/dependabot.yml ignores
# that version; lift both together.
noq-proto = "~1.3"
iroh-mainline-address-lookup = "0.6"
iroh-mdns-address-lookup = "0.6"
fastcdc = "5"
blake3 = "1"
# Only for the count of this process's open files (telemetry).
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
metrics = "0.24"
metrics-util = "0.20"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "grpc-tonic", "tls-ring", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false, features = ["metrics"] }
tonic = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false }
ssh-key = { version = "0.6", features = ["ed25519", "encryption", "std"] }
rusqlite = { version = "0.42", features = ["bundled"] }
jwalk = "0.9"
nix = "0.31"
clap = { version = "4", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
url = { version = "2", features = ["serde"] }
dirs = "7"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
minisign-verify = "0.3"
# Tests only: signs fake releases with the test key.
minisign = { version = "0.10", default-features = false }
ct-codecs = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
rpassword = "7"
fjall = "3.1"
xattr = "1.7"
crossbeam-channel = "0.5"
indicatif = "0.18"
console = "0.16"
jiff = "0.2"
rand = "0.10"
rand_chacha = { version = "0.10", features = ["serde"] }
rand_xoshiro = "0.8"
serde_yaml_ng = "0.10"
unicode-normalization = "0.1"
libc = "0.2"

# iroh 1.3.0 plus one fix: noq reads tokio's clock, so tests on tokio's
# paused clock can skip ahead (n0-computer/iroh#4676). Drop this once a
# release has it. The other crates come from the same commit so that each
# has one source.
[patch.crates-io]
iroh = { git = "https://github.com/irsync-dev/iroh", rev = "28466cc54f86df7a587249f8d54fb747988a3d3f" }
iroh-base = { git = "https://github.com/irsync-dev/iroh", rev = "28466cc54f86df7a587249f8d54fb747988a3d3f" }
iroh-dns = { git = "https://github.com/irsync-dev/iroh", rev = "28466cc54f86df7a587249f8d54fb747988a3d3f" }
iroh-relay = { git = "https://github.com/irsync-dev/iroh", rev = "28466cc54f86df7a587249f8d54fb747988a3d3f" }

# Debug and test builds keep only what a backtrace needs: file names and
# line numbers. Full debug info tripled the time to link the test binaries
# and made the build folder five times larger. For a debugger session, set
# CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
strip = true
lto = "fat"
codegen-units = 1

# The profile that 'dist' will build with: the release settings above.
[profile.dist]
inherits = "release"

# No Cargo crate is released on its own. The one cargo dist package is the
# generic one in packaging/dist, which builds irsync and fileset together
# (see dist-workspace.toml).
[workspace.metadata.dist]
dist = false
