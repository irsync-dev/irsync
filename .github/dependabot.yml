# Weekly update PRs, one per ecosystem. The cooldown waits a week after a
# release before proposing it: most hijacked releases are found and pulled
# within days. Security updates are not delayed by the cooldown.
#
# The Action pins in release.yml come from [dist.github-action-commits] in
# dist-workspace.toml, which Dependabot does not read: update that table to
# match when Dependabot bumps the other workflows, then run
# `.github/scripts/release-yml.sh write`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    # noq-proto 1.4.0 closes connections whose reader falls behind (see
    # Cargo.toml). A later release is proposed as usual, and the tests
    # decide.
    ignore:
      - dependency-name: noq-proto
        versions: ["1.4.0"]

  # The fuzz targets (fuzz/) have a Cargo.lock of their own.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      fuzz:
        patterns: ["*"]
    # As above.
    ignore:
      - dependency-name: noq-proto
        versions: ["1.4.0"]

  - package-ecosystem: github-actions
    directory: /
    # dist writes release.yml; a Dependabot edit there would fail CI's
    # `.github/scripts/release-yml.sh check`.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
