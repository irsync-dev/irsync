# Builds the .deb and .rpm packages for a stable release, adds them to the
# signed apt/dnf repo (irsync-dev/packages, served at https://dist.irsync.org)
# and attaches the same files to the GitHub Release. Release-gate.yml calls
# this after the release succeeded, and release-resume.yml calls it to finish
# a release whose gate failed later on. It is never started on its own.
#
# A re-run for a version the repo already has builds nothing and changes
# nothing in the repo; it only attaches files the release is missing.
#
# A dry run (pre-release tags allowed) builds, signs and checks everything,
# and checks that the token may push to the packages repo, but uploads
# nothing to the release and pushes nothing. The result is a workflow artifact.

name: Packages

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry-run:
        type: boolean
        default: false
    secrets:
      PACKAGES_REPO_TOKEN:
        required: true
      PACKAGES_GPG_PRIVATE_KEY:
        required: true
      PACKAGES_GPG_PASSPHRASE:
        required: true

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only one job at a time may update the packages repo.
    concurrency:
      group: packages-repo
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Work out the version
        run: |
          set -euo pipefail
          prerelease=$(.github/scripts/check-release-tag.sh "$TAG")
          # Only stable tags get packages. A dry run may use a pre-release.
          if [ "$prerelease" != prerelease=false ] && [ "$DRY_RUN" != true ]; then
            echo "::error::Tag '$TAG' is not a stable release tag (vX.Y.Z). No packages."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install the packaging tools
        run: .github/scripts/install-packaging-tools.sh

      - name: Test the packaging scripts
        run: PACKAGING_TESTS_REQUIRED=1 python3 -m unittest discover -s packaging/tests

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # A private keyring, outside the checkout, removed again at the end.
          mkdir "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$GPG_PRIVATE_KEY" | GNUPGHOME="$RUNNER_TEMP/gnupg" gpg --batch --import
          fpr=$(GNUPGHOME="$RUNNER_TEMP/gnupg" gpg --batch --list-secret-keys --with-colons |
            awk -F: '$1 == "fpr" { print $10; exit }')
          if [ -z "$fpr" ]; then
            echo "::error::No secret key was imported."
            exit 1
          fi
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          echo "GPG_KEY_ID=$fpr" >> "$GITHUB_ENV"

      # The token is saved in this checkout's git config, and only here. It is
      # scoped to the packages repo.
      - name: Check out the packages repo
        uses: actions/checkout@v6
        with:
          repository: irsync-dev/packages
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}
          path: packages-repo
          persist-credentials: true

      - name: Check whether the repo has this version
        id: repo
        run: |
          set -euo pipefail
          if packaging/repo-version.sh has packages-repo "$VERSION"; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the Linux archives from the release
        if: steps.repo.outputs.have != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archives"
          gh release download "$TAG" --dir "$RUNNER_TEMP/archives" \
            --pattern 'irsync-x86_64-unknown-linux-musl.tar.xz' \
            --pattern 'irsync-aarch64-unknown-linux-musl.tar.xz'

      - name: Build the packages
        if: steps.repo.outputs.have != 'true'
        run: packaging/build-packages.sh "$RUNNER_TEMP/archives" "$VERSION" "$RUNNER_TEMP/built"

      - name: Add them to the repo and sign it
        if: steps.repo.outputs.have != 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
        run: packaging/update-repo.sh packages-repo "$RUNNER_TEMP/built" 3

      # Taken from the repo, so the release gets the signed .rpm files.
      - name: Collect this version's packages
        run: packaging/repo-version.sh copy packages-repo "$VERSION" "$RUNNER_TEMP/packages"

      - name: Commit and push
        working-directory: packages-repo
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "The packages repo is already up to date."
          else
            git -c user.name='irsync releases' -c user.email='releases@irsync.org' \
              commit -m "irsync $VERSION"
          fi
          if [ "$DRY_RUN" = true ]; then
            # Contacts the repo and checks the token may push, but pushes nothing.
            git push --dry-run
          else
            git push
          fi

      # After the push, so the release and the repo always hold the same files.
      - name: Attach the packages to the release
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          attached=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          files=()
          for f in "$RUNNER_TEMP"/packages/*; do
            name=${f##*/}
            if grep -qxF "$name" <<<"$attached"; then
              echo "$name is already attached."
            else
              files+=("$f")
            fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}"
          fi

      - name: Keep the packages (dry run)
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ inputs.tag }}
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

      - name: Keep the repo tree (dry run)
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@v7
        with:
          name: packages-repo-${{ inputs.tag }}
          path: |
            packages-repo
            !packages-repo/.git
          if-no-files-found: error

      - name: Remove the signing key
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/gnupg" ]; then
            GNUPGHOME="$RUNNER_TEMP/gnupg" gpgconf --kill gpg-agent || true
            rm -rf "$RUNNER_TEMP/gnupg"
          fi
