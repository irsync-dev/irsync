# The release gate. Start it by hand on the branch the release is cut from,
# with the version without the v:
#
#   gh workflow run release-gate.yml --ref main -f version=1.2.0
#   gh workflow run release-gate.yml --ref release-1.2 -f version=1.2.1
#
# (.github/scripts/bump-version.sh prints the right command.) It first checks
# the version, the branch and the tags (release-start-check.sh). Then it runs
# the full test suite (ci.yml, including the musl release targets) on the
# branch's commit, and only if that passes it pins that commit on the branch
# pinned/vX.Y.Z and launches release.yml there. release.yml builds the files
# and creates a GitHub *draft* release for vX.Y.Z. A draft has no tag, so
# until it is published a failed run leaves no tag behind and the gate can
# simply be started again (it deletes a leftover draft first).
#
# The gate ends at the draft. A maintainer then signs the files offline with
# .github/scripts/sign-release.sh X.Y.Z, checks the draft, and publishes it
# with sign-release.sh --publish X.Y.Z. Publishing creates the tag vX.Y.Z,
# and the script starts release-resume.yml on it. That run creates the branch
# release-X.Y for an X.Y.0 release, adds GitHub's change list to the notes
# and, for a stable release, publishes the .deb/.rpm packages and the
# Homebrew formula after an approval of the `release` environment.
#
# release.yml is generated by .github/scripts/release-yml.sh write and must not
# be edited by hand.
# It only starts via workflow_dispatch. Never launch it by hand: that would
# skip the tests. Start this workflow instead.

name: Release gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version, without the v, for example 1.2.3
        type: string
        required: true

permissions:
  contents: read

# The same group as release-resume.yml for this tag, so a gate run and a
# resume run for the same version never run at the same time.
concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Quick checks first, so a typo fails in seconds, not after the tests.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.start.outputs.tag }}
      branch: ${{ steps.start.outputs.branch }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version, the branch and the tags
        id: start
        run: .github/scripts/release-start-check.sh "$VERSION" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      plan: v${{ inputs.version }}
    permissions:
      contents: read

  release:
    needs: [check, test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      # To create and delete the pinned/ branch.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Check that no earlier release run is still going
        run: |
          set -euo pipefail

          # A release.yml run from an earlier attempt could still create the
          # tag. Starting a second one next to it would race it.
          active=$(gh run list --workflow release.yml --limit 100 \
              --json databaseId,status,headBranch |
            jq -r --arg branch "pinned/$TAG" \
              '[.[] | select(.headBranch == $branch or .headBranch == "refs/heads/" + $branch)
                    | select(.status | IN("queued", "in_progress", "waiting", "pending", "requested"))
                    | .databaseId] | join(" ")')
          if [ -n "$active" ]; then
            echo "::error::A release.yml run for $TAG from an earlier attempt is still going: $active. Cancel it (gh run cancel <id>) or wait for it to finish, then start the gate again."
            exit 1
          fi

      - name: Pin the tested commit
        id: pin
        run: |
          set -euo pipefail

          # The check job saw no tag, but the tests took a while. A release
          # published by an earlier attempt in the meantime has the tag now.
          if gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq '.[].ref' |
              grep -qxF -- "refs/tags/$TAG"; then
            echo "::error::The tag $TAG exists now: an earlier attempt published the release while the tests ran. Finish it with release-resume.yml (see the releasing guide), and do not start the gate again."
            exit 1
          fi

          # A pinned/ branch left over from an earlier attempt. The tag does
          # not exist (the check job made sure), so that attempt released
          # nothing, and no run of it is still going (the step above).
          if gh api "repos/$GH_REPO/git/matching-refs/heads/pinned/$TAG" --jq '.[].ref' |
              grep -qxF -- "refs/heads/pinned/$TAG"; then
            echo "Deleting pinned/$TAG left over from an earlier attempt."
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/pinned/$TAG"
          fi

          # The tests ran on $GITHUB_SHA. release.yml runs on this branch, so
          # it builds exactly that commit, even if the source branch moves on.
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/pinned/$TAG" -f sha="$GITHUB_SHA" > /dev/null

      - name: Delete a leftover draft release
        run: |
          set -euo pipefail

          # An earlier attempt may have made a draft. A published release
          # already has the tag, which the checks above refuse. Delete only a
          # draft, and only the release: no tag exists to remove.
          if out=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1); then
            if [ "$out" = true ]; then
              echo "Deleting the draft release $TAG left over from an earlier attempt."
              gh release delete "$TAG" --yes
            fi
          else
            case $out in
              *"release not found"*|*"Not Found"*) ;;
              *) echo "::error::Could not look up the release $TAG: $out"; exit 1 ;;
            esac
          fi

      - name: Launch release.yml on the pinned commit
        id: dispatch
        run: |
          set -euo pipefail

          # Runs of release.yml started on pinned/$TAG. A run started on
          # refs/heads/pinned/$TAG is listed with the branch name; the full
          # ref is accepted too, to be safe.
          list_runs() {
            gh run list --workflow release.yml --event workflow_dispatch \
              --limit 100 --json databaseId,createdAt,headBranch,headSha |
              jq -c --arg branch "pinned/$TAG" \
                '[.[] | select(.headBranch == $branch or .headBranch == "refs/heads/" + $branch)]'
          }

          # Runs that already exist for this tag (from an earlier attempt) are
          # never mistaken for the one we start now.
          before=$(list_runs | jq -c '[.[].databaseId]')
          # Allow a little clock difference between this runner and GitHub.
          since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)

          # The full ref, so a tag with the same name can't be picked.
          gh workflow run release.yml --ref "refs/heads/pinned/$TAG" -f tag="$TAG"

          run=""
          for attempt in $(seq 1 20); do
            sleep 6
            new=$(list_runs | jq -c --argjson before "$before" --arg since "$since" \
              '[.[] | select(.createdAt >= $since)
                    | select(.databaseId | IN($before[]) | not)]')
            count=$(jq 'length' <<<"$new")
            if [ "$count" -eq 1 ]; then
              run=$(jq -c '.[0]' <<<"$new")
              break
            elif [ "$count" -gt 1 ]; then
              echo "::error::Found $count new release.yml runs for $TAG, expected one: $(jq -r '[.[].databaseId] | join(" ")' <<<"$new"). Was release.yml launched by hand?"
              exit 1
            fi
            echo "Waiting for the release.yml run to show up (attempt $attempt)..."
          done

          if [ -z "$run" ]; then
            actions="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml"
            echo "::error::Launched release.yml for $TAG, but could not find its run within two minutes. The release may still be running: check $actions. Do not launch release.yml by hand. If it created the draft, sign it with .github/scripts/sign-release.sh ${TAG#v}, then publish it by adding --publish. If it fails, start the gate again."
            exit 1
          fi

          run_id=$(jq -r '.databaseId' <<<"$run")
          run_sha=$(jq -r '.headSha' <<<"$run")
          if [ "$run_sha" != "$GITHUB_SHA" ]; then
            echo "::error::release.yml run $run_id builds $run_sha, but the tests ran on $GITHUB_SHA. Cancelling it."
            gh run cancel "$run_id" || true
            exit 1
          fi

          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Release run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$run_id"

      - name: Wait for the release run to finish
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run-id }}
        run: gh run watch "$RUN_ID" --exit-status --interval 30

      # Also after a failure or a cancel. Only the pin this run made: if an
      # earlier attempt's run was still going, its pin stays.
      - name: Remove the pinned branch
        if: always()
        env:
          PINNED: ${{ steps.pin.outcome }}
        run: |
          set -euo pipefail
          [ "$PINNED" = success ] || exit 0
          if ! out=$(gh api -X DELETE "repos/$GH_REPO/git/refs/heads/pinned/$TAG" 2>&1); then
            case $out in
              *"Not Found"*|*"Reference does not exist"*) ;;
              *) echo "::warning::Could not delete pinned/$TAG: $out" ;;
            esac
          fi

  # The end of the gate: the draft is ready. Signing and publishing happen
  # offline (sign-release.sh), which then starts release-resume.yml.
  draft:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are visible only with write access; read gets a 404.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Check the draft and say what to do next
        run: |
          set -euo pipefail
          is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$is_draft" != true ]; then
            echo "::error::Expected a draft release for $TAG, but it is not a draft."
            exit 1
          fi
          echo "Draft ready. Sign it: .github/scripts/sign-release.sh ${TAG#v}; check it on GitHub, then publish it: .github/scripts/sign-release.sh --publish ${TAG#v}" | tee -a "$GITHUB_STEP_SUMMARY"
