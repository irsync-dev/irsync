# The release gate. Pushing a tag such as v1.2.3 or v1.2.3-beta.1 starts this
# workflow. It runs the full test suite (ci.yml, including the musl release
# targets) on the tagged commit, and only if that passes it launches
# release.yml for the tag and waits for it to finish. After that, stable
# releases get .deb/.rpm packages in the apt/dnf repo (packages.yml), and every
# release gets GitHub's change list added to its notes.
#
# release.yml is generated by `dist generate` and must not be edited by hand.
# It only starts via workflow_dispatch. Never launch it by hand: that would
# skip the tests. Push a tag instead.

name: Release gate

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      plan: ${{ github.ref_name }}
    permissions:
      contents: read

  release:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      run-id: ${{ steps.dispatch.outputs.run-id }}
      prerelease: ${{ steps.dispatch.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Launch release.yml for the tag
        id: dispatch
        run: |
          set -euo pipefail

          # Only vX.Y.Z, vX.Y.Z-alpha.N and vX.Y.Z-beta.N are releases. This
          # also keeps odd tag names out of release.yml, which puts the tag
          # into shell commands.
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$'
          if ! [[ "$TAG" =~ $tag_re ]]; then
            echo "::error::Tag '$TAG' is not a release tag. Use vX.Y.Z, vX.Y.Z-alpha.N or vX.Y.Z-beta.N."
            exit 1
          fi

          case "$TAG" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          # The tests ran on $GITHUB_SHA. Release only if the tag still points
          # there (it could have been moved while the tests ran).
          obj=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          type=${obj%% *}
          sha=${obj#* }
          # An annotated tag points to a tag object; follow it to the commit.
          while [ "$type" = tag ]; do
            obj=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.type + " " + .object.sha')
            type=${obj%% *}
            sha=${obj#* }
          done
          if [ "$type" != commit ] || [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG now points to $type $sha, but the tests ran on commit $GITHUB_SHA. Not releasing."
            exit 1
          fi

          # Runs of release.yml started for this tag. A run started on
          # refs/tags/$TAG is listed with the tag name as its branch; the
          # full ref is accepted too, to be safe.
          list_runs() {
            gh run list --workflow release.yml --event workflow_dispatch \
              --limit 100 --json databaseId,createdAt,headBranch,headSha |
              jq -c --arg tag "$TAG" \
                '[.[] | select(.headBranch == $tag or .headBranch == "refs/tags/" + $tag)]'
          }

          # Runs that already exist for this tag (from an earlier attempt) are
          # never mistaken for the one we start now.
          before=$(list_runs | jq -c '[.[].databaseId]')
          # Allow a little clock difference between this runner and GitHub.
          since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)

          # The full ref, so a branch with the same name can't be picked.
          gh workflow run release.yml --ref "refs/tags/$TAG" -f tag="$TAG"

          run=""
          for attempt in $(seq 1 20); do
            sleep 6
            new=$(list_runs | jq -c --argjson before "$before" --arg since "$since" \
              '[.[] | select(.createdAt >= $since)
                    | select(.databaseId | IN($before[]) | not)]')
            count=$(jq 'length' <<<"$new")
            if [ "$count" -eq 1 ]; then
              run=$(jq -c '.[0]' <<<"$new")
              break
            elif [ "$count" -gt 1 ]; then
              echo "::error::Found $count new release.yml runs for $TAG, expected one: $(jq -r '[.[].databaseId] | join(" ")' <<<"$new"). Was release.yml launched by hand?"
              exit 1
            fi
            echo "Waiting for the release.yml run to show up (attempt $attempt)..."
          done

          if [ -z "$run" ]; then
            echo "::error::Launched release.yml for $TAG, but no new run showed up within two minutes."
            exit 1
          fi

          run_id=$(jq -r '.databaseId' <<<"$run")
          run_sha=$(jq -r '.headSha' <<<"$run")
          if [ "$run_sha" != "$GITHUB_SHA" ]; then
            echo "::error::release.yml run $run_id builds $run_sha, but the tests ran on $GITHUB_SHA. Cancelling it."
            gh run cancel "$run_id" || true
            exit 1
          fi

          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Release run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$run_id"

      - name: Wait for the release run to finish
        run: gh run watch "${{ steps.dispatch.outputs.run-id }}" --exit-status --interval 30

  # Stable releases only: pre-releases stop at the GitHub Release.
  packages:
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.prerelease != 'true'
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      PACKAGES_REPO_TOKEN: ${{ secrets.PACKAGES_REPO_TOKEN }}
      PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
      PACKAGES_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
    permissions:
      contents: write

  notes:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Add GitHub's change list to the release notes
        run: |
          set -euo pipefail
          heading="## What's changed"

          body=$(gh release view "$TAG" --json body --jq .body)
          # A re-run must not add the list twice.
          if grep -qxF "$heading" <<<"$body"; then
            echo "The release notes already have '$heading'. Nothing to do."
            exit 0
          fi

          generated=$(gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)

          {
            printf '%s' "$body"
            [ -n "$body" ] && printf '\n\n'
            printf '%s\n\n%s\n' "$heading" "$generated"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
