# Checks the dependencies against the RustSec advisory database every day, so
# a new advisory against code nobody touched is still noticed. A failure is a
# failed workflow run, which GitHub emails about. Fix it as in ci.yml's deny
# job: upgrade, or accept it in deny.toml's ignore list with a reason.

name: Advisories

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: Check for advisories
        run: cargo deny --locked check advisories -D advisory-not-detected
