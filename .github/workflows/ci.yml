name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release gate (release-gate.yml) calls this as its test gate on a tag push.
  workflow_call:
    inputs:
      plan:
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}${{ matrix.target && format(' {0}', matrix.target) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # In a called workflow github.event_name is the caller's event, so
        # `inputs.plan` tells a release run (it is set) from a normal one.
        include: ${{ fromJSON(inputs.plan && '[{"os":"ubuntu-latest","target":""},{"os":"macos-latest","target":""},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"}]' || '[{"os":"ubuntu-latest","target":""},{"os":"macos-latest","target":""}]') }}
    env:
      TARGET_FLAG: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust (the version in rust-toolchain.toml)
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi
          rustc --version
      - name: Install musl-tools and aim cargo at the target
        if: matrix.target != ''
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          # Also makes the netstress tests' nested fault build use the target.
          echo "CARGO_BUILD_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Install rsync (reference implementation for the comparison test)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The system rsync is 2.6.9/openrsync; the comparison test needs GNU 3.1+.
            brew install rsync
            echo "$(brew --prefix rsync)/bin" >> "$GITHUB_PATH"
          elif ! command -v rsync >/dev/null; then
            sudo apt-get update && sudo apt-get install -y rsync
          fi
      - name: Show rsync version the tests will use
        run: rsync --version | head -1
      - name: Format
        run: cargo fmt --all --check
      - name: Test the dev setup script
        run: python3 -m unittest discover -s tools/tests
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features $TARGET_FLAG -- -D warnings
      - name: Clippy without OpenTelemetry
        run: cargo clippy --locked --workspace --all-targets --no-default-features $TARGET_FLAG -- -D warnings
      # nextest runs each test in its own process, tests from all files side
      # by side, and kills a hung test (see .config/nextest.toml). It does
      # not run doc tests, so cargo test runs those. On macOS the ci-macos
      # profile leaves out slow tests that Linux covers.
      - name: Test
        env:
          PROFILE: ${{ runner.os == 'macOS' && 'ci-macos' || 'ci' }}
        run: cargo nextest run --locked --workspace --all-features --profile "$PROFILE" --run-ignored all $TARGET_FLAG
      - name: Doc tests
        run: cargo test --locked --workspace --all-features --doc $TARGET_FLAG

  # Runs the release build itself (dist and packaging/dist/build.sh) for the
  # Linux targets, on the same runners as release.yml, so a broken release
  # build shows up here and not after the tag is pushed. The release gate
  # skips it: release.yml runs the same build there anyway.
  release-build:
    name: release build ${{ matrix.target }}
    if: ${{ !inputs.plan }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            dist: cargo-dist-x86_64-unknown-linux-gnu
            dist_sha256: 7fee44ff3ff71ed0064b32d4ec62fee6b58bd37c5887b12a86aedddc5af0c7b5
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            dist: cargo-dist-aarch64-unknown-linux-gnu
            dist_sha256: 58efb33edf01342875bfd0c3ce2befa9d73075579ca1b3e5dd75b98c88f92e83
    env:
      # Keep equal to cargo-dist-version in dist-workspace.toml.
      DIST_VERSION: 0.34.0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust (the version in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-build-${{ matrix.target }}
      - name: Install dist
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/dist.tar.xz" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/${{ matrix.dist }}.tar.xz"
          echo "${{ matrix.dist_sha256 }}  $RUNNER_TEMP/dist.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/dist.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${{ matrix.dist }}" >> "$GITHUB_PATH"
      - name: Build the release artifacts
        run: dist build --artifacts=local --target=${{ matrix.target }}
      - name: Check the tarball holds both binaries
        run: |
          set -euo pipefail
          tar -tJf target/distrib/irsync-${{ matrix.target }}.tar.xz > contents.txt
          cat contents.txt
          grep -qx "irsync-${{ matrix.target }}/irsync" contents.txt
          grep -qx "irsync-${{ matrix.target }}/fileset" contents.txt
