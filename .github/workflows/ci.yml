name: CI

on:
  # A change that touches only Markdown, the book or the site skips CI; the
  # site workflow (site.yml) checks those. paths-ignore does not apply to
  # workflow_call, so the release gate always runs everything.
  push:
    branches: [main, 'release-*']
    paths-ignore:
      - '**/*.md'
      - book/**
      - site/**
  # No paths-ignore here: "CI result" is a required check on main, so it must
  # report on every pull request. The `changes` job skips the builds instead.
  pull_request:
  # The release gate (release-gate.yml) calls this as its test gate, on the
  # commit it is about to release.
  workflow_call:
    inputs:
      plan:
        type: string
        required: false

# A new push to a pull request cancels the run of the push before it, which
# frees its runners (the macOS ones are scarce). Every other run gets a
# group of its own, so a push to main or a release always runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The checks themselves are in tools/ci.sh, one job there per job here, so
# they run the same on a developer's machine. This file keeps what is
# GitHub's: the triggers, the runners and the tool installs.
jobs:
  # Does this change need the builds? Only a pull request can say no: a
  # Markdown-, book/- or site/-only change skips them (see code-changed.sh).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            .github/scripts/code-changed.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.os }}${{ matrix.target && format(' {0}', matrix.target) || '' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # In a called workflow github.event_name is the caller's event, so
        # `inputs.plan` tells a release run (it is set) from a normal one.
        include: ${{ fromJSON(inputs.plan && '[{"os":"ubuntu-latest","target":""},{"os":"macos-latest","target":""},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"}]' || '[{"os":"ubuntu-latest","target":""},{"os":"macos-latest","target":""}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (the version in rust-toolchain.toml)
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi
          rustc --version
      - name: Install musl-tools and aim cargo at the target
        if: matrix.target != ''
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools pandoc
          # tools/ci.sh check builds for this target. It also makes the
          # netstress tests' nested fault build use it.
          echo "CARGO_BUILD_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest@0.9.151
      - name: Install rsync (reference implementation for the comparison test)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The system rsync is 2.6.9/openrsync; the comparison test needs GNU 3.1+.
            brew install rsync
            echo "$(brew --prefix rsync)/bin" >> "$GITHUB_PATH"
          elif ! command -v rsync >/dev/null; then
            sudo apt-get update && sudo apt-get install -y rsync
          fi
      - name: Show rsync version the tests will use
        run: rsync --version | head -1
      - name: Install pandoc and mandoc (to build the man pages)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS ships /usr/bin/mandoc.
            brew install pandoc
          else
            sudo apt-get update && sudo apt-get install -y pandoc mandoc
          fi
          pandoc --version | head -1
      # Format, the dev-setup tests, clippy twice, the tests with nextest
      # and the doc tests. On macOS it leaves out slow tests that Linux
      # covers (the ci-macos profile).
      - name: Format, clippy and tests
        run: tools/ci.sh check

  # Runs the release build itself (dist and packaging/dist/build.sh) for the
  # Linux targets, on the same runners as release.yml, so a broken release
  # build shows up here and not in a release run. The release gate
  # skips it: release.yml runs the same build there anyway.
  release-build:
    name: release build ${{ matrix.target }}
    needs: changes
    if: ${{ !inputs.plan && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            dist: cargo-dist-x86_64-unknown-linux-gnu
            dist_sha256: 7fee44ff3ff71ed0064b32d4ec62fee6b58bd37c5887b12a86aedddc5af0c7b5
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            dist: cargo-dist-aarch64-unknown-linux-gnu
            dist_sha256: 58efb33edf01342875bfd0c3ce2befa9d73075579ca1b3e5dd75b98c88f92e83
    env:
      # Keep equal to cargo-dist-version in dist-workspace.toml.
      DIST_VERSION: 0.34.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (the version in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-build-${{ matrix.target }}
      - name: Install dist
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/dist.tar.xz" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/${{ matrix.dist }}.tar.xz"
          echo "${{ matrix.dist_sha256 }}  $RUNNER_TEMP/dist.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/dist.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${{ matrix.dist }}" >> "$GITHUB_PATH"
      # dist generate --check, the build, and a look inside the tarball.
      - name: Build the release artifacts
        env:
          CI_RELEASE_TARGET: ${{ matrix.target }}
        run: tools/ci.sh release-build

  # The workflow rules (.github/scripts/tests, including the supply chain
  # policy in test_workflow_policy.py) and actionlint, on every change: a
  # workflow change is code too. Cheap, so it doesn't wait for `changes`.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Workflow rule tests and actionlint
        run: tools/ci.sh workflows

  # Dependencies: known vulnerabilities, unmaintained or yanked crates,
  # licenses and sources, as set in deny.toml. Fails on any advisory; an
  # accepted one goes in deny.toml's ignore list with a reason.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: Check the dependencies
        run: tools/ci.sh deny

  # Flags a pull request that adds or bumps a dependency with a known
  # vulnerability, in the pull request itself.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  # The one check the main branch ruleset requires: passes when every job
  # above succeeded or was skipped.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, check, release-build, workflows, deny, dependency-review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/ci-result.sh "$NEEDS"
