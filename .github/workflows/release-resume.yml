# Finishes a release that release.yml already published, when the gate
# stopped before the packages or the notes (for example because the Homebrew
# push failed, or the gate lost track of the release.yml run). Start it by
# hand on main: Actions, Release resume, Run workflow, with the tag.
#
# It never builds or publishes a release. It only runs packages.yml (stable
# releases) and the notes step for a GitHub Release that already exists. Both
# are safe to run again.
#
# Dry run: builds and signs the packages for any release, including a
# pre-release, and checks the packages repo token, but publishes nothing. The
# packages and the repo tree are kept as workflow artifacts. Use it to try the
# packaging on the alpha rehearsal before the first stable release.

name: Release resume

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v1.2.3
        type: string
        required: true
      dry-run:
        description: Dry run (build and sign packages, publish nothing)
        type: boolean
        default: false

permissions:
  contents: read

# The same group as the gate run for this tag, so the two never overlap.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.check.outputs.packages }}
      notes: ${{ steps.check.outputs.notes }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry-run }}
      MAIN_REF: refs/heads/${{ github.event.repository.default_branch }}
    steps:
      - name: Check the branch
        run: |
          # The scripts and secrets used below must come from reviewed code.
          if [ "$GITHUB_REF" != "$MAIN_REF" ]; then
            echo "::error::Run this workflow on ${MAIN_REF#refs/heads/}, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the tag and the release
        id: check
        run: .github/scripts/resume-check.sh "$TAG" "$DRY_RUN" >> "$GITHUB_OUTPUT"

  packages:
    needs: check
    if: needs.check.outputs.packages == 'true'
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      PACKAGES_REPO_TOKEN: ${{ secrets.PACKAGES_REPO_TOKEN }}
      PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
      PACKAGES_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
    permissions:
      contents: write

  notes:
    needs: check
    if: needs.check.outputs.notes == 'true'
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: write
