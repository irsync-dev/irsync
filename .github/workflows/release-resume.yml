# The second half of every release. sign-release.sh starts it on the new tag
# once it has signed and published the draft release. Start it by hand on the
# tag to finish a release whose resume run failed (for example because the
# Homebrew push failed). It runs on the tag, so the
# release secrets (environment `release`, v* tags only) open and the tagged
# scripts run:
#
#   gh workflow run release-resume.yml --ref v1.2.3 -f tag=v1.2.3
#
# It never builds or publishes a release, and creates no branch
# (release-prepare.yml makes release-X.Y). It runs packages.yml and
# publish-homebrew.yml (stable releases) and the notes step for a GitHub
# Release that already exists. All are safe to run again.
#
# Dry run: builds and signs the packages for any release, including a
# pre-release, and checks the packages repo token, but publishes nothing. The
# packages and the repo tree are kept as workflow artifacts. Use it to try the
# packaging on the alpha rehearsal before the first stable release.

name: Release resume

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v1.2.3
        type: string
        required: true
      dry-run:
        description: Dry run (build and sign packages, publish nothing)
        type: boolean
        default: false

permissions:
  contents: read

# The same group as the gate run for this tag, so the two never overlap.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.check.outputs.packages }}
      homebrew: ${{ steps.check.outputs.homebrew }}
      notes: ${{ steps.check.outputs.notes }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also checks that this run is on the tag itself (GITHUB_REF).
      - name: Check the tag and the release
        id: check
        run: .github/scripts/resume-check.sh "$TAG" "$DRY_RUN" >> "$GITHUB_OUTPUT"

  packages:
    needs: check
    if: needs.check.outputs.packages == 'true'
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.dry-run }}
    # Environment secrets reach a called workflow's job only with `inherit`.
    # No secret is stored repo-wide, so nothing else comes along
    # (tools/github_settings.py checks that).
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      attestations: write

  homebrew:
    needs: check
    if: needs.check.outputs.homebrew == 'true'
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      tag: ${{ inputs.tag }}
    # Environment secrets reach a called workflow's job only with `inherit`.
    # No secret is stored repo-wide, so nothing else comes along
    # (tools/github_settings.py checks that).
    secrets: inherit
    permissions:
      contents: read

  notes:
    needs: check
    if: needs.check.outputs.notes == 'true'
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: write
