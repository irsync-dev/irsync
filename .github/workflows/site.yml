name: Site

# A push to main that touches the site, the book, or what the site check reads
# (the CLI's flags, files the book refers to) builds it, checks it and deploys
# it to staging (Worker irsync-dev, dev.irsync.org). Running the workflow by
# hand promotes the newest staging build to production (Worker irsync-pub,
# irsync.org): the same files, downloaded from that run's artifact, not rebuilt.
#
# Each Worker has its own deploy token, allowed to change only that Worker:
# CLOUDFLARE_API_TOKEN_DEV and CLOUDFLARE_API_TOKEN_PUB.

on:
  push:
    branches: [main]
    paths:
      - book/**
      - site/**
      - README.md
      - crates/**
      - proto/**
      - docs/**
      - .githooks/**
      - tools/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # Kept in step with site/deploy.sh.
  WRANGLER_VERSION: 4.152.0
  MDBOOK_VERSION: 0.5.2

jobs:
  staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: site-staging
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install mdbook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build irsync (for the flag check)
        run: cargo build -p irsync
      - name: Site tool tests
        run: python3 -m unittest discover -s site/tools -p 'test_*.py'
      - name: Build
        run: |
          site/build.sh
          echo "$GITHUB_SHA" > target/site/BUILD
      - name: Check
        run: python3 site/tools/check.py --irsync target/debug/irsync target/site
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: target/site
          include-hidden-files: true
      - name: Deploy to irsync-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" deploy \
            --config site/wrangler.jsonc --name irsync-dev --assets target/site

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: site-promote
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Only the deploy settings; the files come from the staging build.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: site/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download the newest staging build
        run: |
          # --event push: a promote run of this workflow succeeds too, but has no artifact.
          id=$(gh run list --workflow site.yml --branch main --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ]; then
            echo "no successful staging run on main" >&2
            exit 1
          fi
          gh run download "$id" -n site -D site-out
      - name: Deploy to irsync-pub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PUB }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" deploy \
            --config site/wrangler.jsonc --name irsync-pub --assets site-out
      - name: Summary
        run: echo "Promoted $(cat site-out/BUILD) to irsync.org" >> "$GITHUB_STEP_SUMMARY"
