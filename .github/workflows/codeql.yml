# CodeQL, GitHub's code analysis, reads the Rust code and the workflows and
# looks for security bugs. It needs no build (build-mode: none). What it
# finds shows under the repository's Security tab, "Code scanning", and on
# the lines a pull request changes. It is not part of "CI result" (ci.yml)
# yet; it becomes a required check once a few weeks show it is quiet.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Weekly as well: a new CodeQL release can find something in code that
  # has not changed.
  schedule:
    - cron: '27 3 * * 1'

# As in ci.yml: a new push to a pull request cancels the run before it.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # security-events: write uploads the findings to code scanning.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The integration tests never ship, and what CodeQL finds there
          # is the tests' own throwaway data in assert messages (a test
          # passphrase file's path, say). The product code, its unit tests
          # included, is still read in full.
          config: |
            paths-ignore:
              - crates/*/tests/**
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
