# Fuzzes every target in fuzz/ for ten minutes each night, on the corpus
# the nights before grew. A crash, a hang or runaway memory fails the run,
# which GitHub emails about, and the failing inputs are uploaded. See
# "Fuzzing" in book/src/contributing/testing.md for what to do with one.
#
# Also runs the tests that Miri can run (tools/ci.sh miri), which catches
# undefined behaviour in unsafe code. See "Static analysis" in the same
# chapter.

name: Nightly

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in ci.yml's fuzz-build job.
      - name: Install Rust (the nightly in fuzz/rust-toolchain.toml)
        run: |
          nightly=$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)
          rustup toolchain install "$nightly" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$nightly" >> "$GITHUB_ENV"
          rustup run "$nightly" rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-fuzz@0.13.2
          fallback: cargo-install
      # Each run saves the corpus under its own key; the next restores the
      # newest by the prefix.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target
        env:
          FUZZ_SECONDS: 600
        run: tools/ci.sh fuzz
      # Also after a crash: what the run found is kept for the next.
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tools/ci.sh runs cargo with +nightly itself.
      - name: Install Rust (the nightly in fuzz/rust-toolchain.toml) with Miri
        run: |
          nightly=$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)
          rustup toolchain install "$nightly" --profile minimal --component miri --component rust-src
          cargo "+$nightly" miri setup
      - name: Run the tests under Miri
        run: tools/ci.sh miri
